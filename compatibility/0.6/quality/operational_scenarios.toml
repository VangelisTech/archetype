version = 1

# Operational inventory consumed by the static audit and execution runner.
# Rows describe evidence enforced in the current slice, not future aspirations
# or stdout-only smoke checks.

[[scenario]]
id = "example.00_quickstart"
kind = "example"
owner = "runtime"
owner_paths = ["packages/archetype-ecs/src/archetype/runtime"]
source_path = "examples/00_quickstart.py"
source_command = ["python", "examples/00_quickstart.py"]
required_extras = []
tier = 1
applicability = ["source", "wheel"]
timeout_seconds = 60
prerequisites = []
missing_prerequisite = "fail"
semantic_oracle = { kind = "pytest", ref = "tests/integration/test_core_example_receipts.py::test_quickstart_receipt_proves_three_processor_ticks" }
contracts = [
  "core.processors.execution",
  "runtime.trust.actor_free",
]
cleanup_policy = "isolated"
artifact_policy = "receipt"
artifact_schema = "archetype.operational-results/v1"
required_cadence = ["pr", "main", "release"]

