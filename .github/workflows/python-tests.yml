name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every PR base is intentional: dependent/stacked PRs need their own evidence.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --all-extras --group dev
      - run: make static

  tests:
    name: Tests (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --all-extras --group dev
      - run: make test
      - run: make package-smoke

  ddlog-storage:
    name: DDlog storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt -p archetype-ddlog -- --check
      - run: cargo +1.95.0 clippy -p archetype-ddlog --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test -p archetype-ddlog --locked
      # Native integration is explicit local evidence until a reviewed DDlog
      # toolchain image is available. Default tests cannot stand in for it.
