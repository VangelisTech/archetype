name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI gate (lint + lock-check + tests with coverage)
        run: make ci

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: archetype-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run regression evals
        run: make eval-reg

      # Capability evals are deterministic and credential-free; they gate the
      # merge so behavior regressions (e.g. tick-semantics changes) can't slip
      # through eval-reg alone.
      - name: Run capability evals
        run: make eval-cap

      # Spec-contract evals bind normative docs/guide clauses to executable
      # guardrails (see evals/suites/spec_contracts.py). Previously this suite
      # never ran in CI — it gates the merge now.
      - name: Run spec-contract evals
        run: make eval-spec

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      # ty is the type gate (config in [tool.ty]); pinned to match the
      # astral-sh/ty-pre-commit rev in .pre-commit-config.yaml. Blocking.
      - name: Run ty
        run: uvx ty@0.0.48 check --python .venv

  # Every numbered example must run credential-free (the CLAUDE.md contract:
  # LLM-backed examples degrade gracefully when keys are missing). Blocking.
  examples:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run all numbered examples
        run: |
          for f in examples/[0-9][0-9]_*.py; do
            echo "::group::$f"
            uv run python "$f"
            echo "::endgroup::"
          done
