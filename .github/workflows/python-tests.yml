name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI gate (lint + lock-check + tests with coverage)
        run: make ci

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: archetype-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  evals:
    runs-on: ubuntu-latest
    env:
      # Real workload jobs report to Logfire when the org token is set;
      # absent secret -> empty var -> archetype._obs stays vendor-free.
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run regression evals
        run: make eval-reg

      # Capability evals are deterministic and credential-free; they gate the
      # merge so behavior regressions (e.g. tick-semantics changes) can't slip
      # through eval-reg alone.
      - name: Run capability evals
        run: make eval-cap

  # Real object-store gate. The R2 catalog token vends short-lived object-store
  # credentials, so no local or runner-side Docker service is involved.
  infrastructure-idempotency:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_API_ENDPOINT: ${{ vars.R2_API_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify R2 integration credentials
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_API_ENDPOINT"
          test -n "$R2_BUCKET"

      - name: Run R2 Data Catalog idempotency integration
        run: make test-infra

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      # ty is the type gate (config in [tool.ty]); pinned to match the
      # astral-sh/ty-pre-commit rev in .pre-commit-config.yaml. Blocking.
      - name: Run ty
        run: uvx ty@0.0.48 check --python .venv

  # Every numbered example must run credential-free (the CLAUDE.md contract:
  # LLM-backed examples degrade gracefully when keys are missing). Blocking.
  examples:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run all numbered examples
        run: |
          for f in examples/[0-9][0-9]_*.py; do
            echo "::group::$f"
            uv run python "$f"
            echo "::endgroup::"
          done
