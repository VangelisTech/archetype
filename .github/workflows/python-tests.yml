name: Python tests (aio)

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: python -m pip install -U pip uv

      - name: Install dev dependencies
        working-directory: archetype
        run: uv pip install -e '.[dev]'

      - name: Run aio tests with coverage
        working-directory: archetype
        run: |
          uv run pytest \
            tests/aio \
            --maxfail=1 --disable-warnings \
            --cov=archetype.core.aio --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html \
            --cov-fail-under=95

      - name: Upload coverage html artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: archetype/htmlcov

      - name: Upload coverage xml artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: archetype/coverage.xml


