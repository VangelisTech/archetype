name: Daily Security Audit

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-security-audit
  cancel-in-progress: false

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependency audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit==2.7.3

      - name: Prepare dependency audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/security-artifacts
          date -u +%F > .github/security-artifacts/report-date.txt
          git rev-parse HEAD > .github/security-artifacts/commit.txt
          python --version > .github/security-artifacts/python-version.txt
          uv --version > .github/security-artifacts/uv-version.txt

          if uv export --all-extras --format requirements-txt > .github/security-artifacts/requirements.txt 2> .github/security-artifacts/uv-export.stderr; then
            printf "uv export succeeded\n" > .github/security-artifacts/dependency-audit-status.txt
            if pip-audit -r .github/security-artifacts/requirements.txt --format json -o .github/security-artifacts/pip-audit.json > .github/security-artifacts/pip-audit.stdout 2> .github/security-artifacts/pip-audit.stderr; then
              printf "pip-audit succeeded\n" >> .github/security-artifacts/dependency-audit-status.txt
            else
              printf "pip-audit reported findings or failed; inspect pip-audit.json and stderr\n" >> .github/security-artifacts/dependency-audit-status.txt
            fi
          else
            printf "uv export failed; dependency graph may be unsatisfiable\n" > .github/security-artifacts/dependency-audit-status.txt
          fi

      - name: Generate daily security report with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Produce today's Archetype security audit report.

            Inputs to read:
            - SECURITY_AUDIT_2026-03-28.md
            - docs/reports/2026-03-28-security-program-review.md
            - current security-relevant code under src/archetype/app/auth/, src/archetype/api/, and src/archetype/app/
            - dependency evidence under .github/security-artifacts/

            Requirements:
            - Write the final markdown report to .github/security-artifacts/daily-security-audit.md
            - Focus on outstanding security findings, noteworthy positive design decisions, dependency CVEs/advisories, dependency-resolution failures, and the highest-priority next actions
            - Include the standing audit in the report by reference
            - Be concise but specific
            - Do not modify any files other than .github/security-artifacts/daily-security-audit.md
          claude_args: "--max-turns 6"

      - name: Create or update daily security audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Daily Security Audit $(date -u +%F)"
          BODY_FILE=".github/security-artifacts/daily-security-audit.md"

          ISSUE_NUMBER="$(
            gh issue list --state open --search "$TITLE in:title" --json number,title |
            python -c 'import json, sys; title = sys.argv[1]; data = json.load(sys.stdin); print(next((str(item["number"]) for item in data if item["title"] == title), ""))' "$TITLE"
          )"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Upload security audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-security-audit
          path: .github/security-artifacts/
