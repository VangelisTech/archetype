name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag (for example, v0.7.0)"
        required: true
        type: string

permissions: {}

# Releases are single-flight: one tag, one immutable artifact set, one
# publish sequence at a time.
concurrency:
  group: archetype-release
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize release operator
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag_object_sha: ${{ steps.release_ref.outputs.tag_object_sha }}
    steps:
      - name: Require everettVT and an exact release tag
        id: release_ref
        shell: bash
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          fail() { echo "release authorization failed: $*" >&2; exit 1; }

          [[ "$RELEASE_REPOSITORY" == "VangelisTech/archetype" ]] || fail "wrong repository"
          [[ "$RELEASE_EVENT" == "workflow_dispatch" ]] || fail "wrong event"
          [[ "$RELEASE_ACTOR" == "everettVT" ]] || fail "wrong actor"
          [[ "$RELEASE_TRIGGERING_ACTOR" == "everettVT" ]] || fail "wrong triggering actor"
          [[ "$RELEASE_REF_TYPE" == "tag" ]] || fail "workflow ref is not a tag"
          [[ "$RELEASE_INPUT_TAG" == "$RELEASE_REF_NAME" ]] || fail "input and ref differ"
          [[ "$RELEASE_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "tag must be canonical vMAJOR.MINOR.PATCH"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "release commit is not 40-hex"

          tag_ref="refs/tags/$RELEASE_REF_NAME"
          remote="https://github.com/VangelisTech/archetype.git"
          output="$(git ls-remote --exit-code "$remote" "$tag_ref" "$tag_ref^{}")"
          direct_sha=
          peeled_sha=
          while IFS= read -r line; do
            sha=
            ref=
            extra=
            IFS=$'\t' read -r sha ref extra <<< "$line"
            [[ -z "$extra" ]] || fail "malformed ls-remote output"
            [[ "$line" == "$sha"$'\t'"$ref" ]] || fail "malformed ls-remote output"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "remote SHA is not 40-hex"
            case "$ref" in
              "$tag_ref")
                [[ -z "$direct_sha" ]] || fail "duplicate direct tag ref"
                direct_sha="$sha"
                ;;
              "$tag_ref^{}")
                [[ -z "$peeled_sha" ]] || fail "duplicate peeled tag ref"
                peeled_sha="$sha"
                ;;
              *) fail "unexpected remote ref $ref" ;;
            esac
          done <<< "$output"
          [[ -n "$direct_sha" ]] || fail "direct tag ref is absent"
          resolved_sha="${peeled_sha:-$direct_sha}"
          [[ "$resolved_sha" == "$RELEASE_COMMIT" ]] || fail "remote tag commit differs"
          printf 'tag_object_sha=%s\n' "$direct_sha" >> "$GITHUB_OUTPUT"

  release-profile:
    name: Exact credential-free release verification
    needs: authorize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: archetype
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: archetype
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: everettVT/ddlog-runtime
          ref: e7bec261336ac5cdaa6d99778feeaedcb03a73ae
          path: native-upstream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Verify immutable version and prepare exact native/toolchain inputs
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME#v}" = "$(make --no-print-directory version)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
          cargo +1.95.0 build -p archetype-ddlog-python --locked
          python3 ../native-upstream/scripts/bootstrap-native.py "$RUNNER_TEMP/ddlog-native"
          cat > "$RUNNER_TEMP/actual-driver.sh" <<'DRIVER'
          #!/bin/sh
          set -eu
          . "$DDLOG_ACCEPTANCE_TOOLCHAIN/env.sh"
          exec "$DDLOG_ACCEPTANCE_UPSTREAM/scripts/build-ddlog.sh" "$@"
          DRIVER
          chmod +x "$RUNNER_TEMP/actual-driver.sh"
      - name: Seal eight artifacts and test those exact installed release inputs
        env:
          DDLOG_PYTHON_LIBRARY: ${{ github.workspace }}/archetype/target/debug/libarchetype_ddlog_python.so
          ARCHETYPE_ACCEPTANCE_DRIVER: ${{ runner.temp }}/actual-driver.sh
          ACCEPTANCE_STAGE: ${{ runner.temp }}/installed-release
          DDLOG_ACCEPTANCE_TOOLCHAIN: ${{ runner.temp }}/ddlog-native
          DDLOG_ACCEPTANCE_UPSTREAM: ${{ github.workspace }}/native-upstream
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --all-extras --group dev --group docs
          make verify-release
      - name: Retain exact artifacts and release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-release-${{ github.sha }}
          path: |
            archetype/dist/
            archetype/release-artifact.json
            archetype/current-reliability-results.json
            archetype/current-coverage.json
            archetype/package-smoke-results.json
            archetype/site/
            ${{ runner.temp }}/installed-release
            ${{ runner.temp }}/ddlog-native/receipt.json
            ${{ runner.temp }}/actual-driver.sh
            archetype/target/debug/libarchetype_ddlog_python.so
          if-no-files-found: error
          retention-days: 14
# Package-index publishing and external deployment require their own reviewed
# current-package delivery configuration. This workflow verifies and retains;
# it has no write token, provider secrets or automatic deployment side effect.
