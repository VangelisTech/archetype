name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag (for example, v0.6.0)"
        required: true
        type: string

permissions: {}

# The Modal lane uses one static CODEX_AUTH_VOLUME. Keep release workflows
# single-flight because that credential broker has no concurrent-owner contract.
concurrency:
  group: archetype-release
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize release operator
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag_object_sha: ${{ steps.release_ref.outputs.tag_object_sha }}
    steps:
      - name: Require everettVT and an exact release tag
        id: release_ref
        shell: bash
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          fail() { echo "release authorization failed: $*" >&2; exit 1; }

          [[ "$RELEASE_REPOSITORY" == "VangelisTech/archetype" ]] || fail "wrong repository"
          [[ "$RELEASE_EVENT" == "workflow_dispatch" ]] || fail "wrong event"
          [[ "$RELEASE_ACTOR" == "everettVT" ]] || fail "wrong actor"
          [[ "$RELEASE_TRIGGERING_ACTOR" == "everettVT" ]] || fail "wrong triggering actor"
          [[ "$RELEASE_REF_TYPE" == "tag" ]] || fail "workflow ref is not a tag"
          [[ "$RELEASE_INPUT_TAG" == "$RELEASE_REF_NAME" ]] || fail "input and ref differ"
          [[ "$RELEASE_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "tag must be canonical vMAJOR.MINOR.PATCH"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "release commit is not 40-hex"

          tag_ref="refs/tags/$RELEASE_REF_NAME"
          remote="https://github.com/VangelisTech/archetype.git"
          output="$(git ls-remote --exit-code "$remote" "$tag_ref" "$tag_ref^{}")"
          direct_sha=
          peeled_sha=
          while IFS= read -r line; do
            sha=
            ref=
            extra=
            IFS=$'\t' read -r sha ref extra <<< "$line"
            [[ -z "$extra" ]] || fail "malformed ls-remote output"
            [[ "$line" == "$sha"$'\t'"$ref" ]] || fail "malformed ls-remote output"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "remote SHA is not 40-hex"
            case "$ref" in
              "$tag_ref")
                [[ -z "$direct_sha" ]] || fail "duplicate direct tag ref"
                direct_sha="$sha"
                ;;
              "$tag_ref^{}")
                [[ -z "$peeled_sha" ]] || fail "duplicate peeled tag ref"
                peeled_sha="$sha"
                ;;
              *) fail "unexpected remote ref $ref" ;;
            esac
          done <<< "$output"
          [[ -n "$direct_sha" ]] || fail "direct tag ref is absent"
          resolved_sha="${peeled_sha:-$direct_sha}"
          [[ "$resolved_sha" == "$RELEASE_COMMIT" ]] || fail "remote tag commit differs"
          printf 'tag_object_sha=%s\n' "$direct_sha" >> "$GITHUB_OUTPUT"

  release-profile:
    name: Release verification
    needs: authorize-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - run: uv sync --all-packages --all-extras --group dev --group docs
      - name: Verify tag and package version agree
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(make --no-print-directory version)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main
      - run: make verify-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-archetype-ecs
          path: dist/archetype_ecs-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-archetype-missions
          path: dist/archetype_missions-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-archetype-physical-ai
          path: dist/archetype_physical_ai-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-archetype-research
          path: dist/archetype_research-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-archetype-smol
          path: dist/archetype_smol-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-evidence
          path: |
            coverage.xml
            eval-conformance-results.json
            eval-reliability-results.json
            release-artifact.json
            operational-release-results.json
            operational-release-results.d/
          if-no-files-found: error

  external-evidence:
    name: Release evidence (${{ matrix.name }})
    needs: release-profile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenAI
            runner: '["ubuntu-latest"]'
            target: operational-release-openai
            receipt: operational-release-openai-results.json
          - name: Docker
            runner: '["ubuntu-latest"]'
            target: operational-release-docker
            receipt: operational-release-docker-results.json
          - name: Cloudflare R2
            runner: '["ubuntu-latest"]'
            target: operational-release-r2
            receipt: operational-release-r2-results.json
          - name: Modal Agent Mission
            runner: '["ubuntu-latest"]'
            target: operational-release-modal
            receipt: operational-release-modal-results.json
          - name: Physical AI (Modal + R2)
            runner: '["ubuntu-latest"]'
            target: operational-release-physical-modal-r2
            receipt: operational-release-physical-modal-r2-results.json
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ matrix.target == 'operational-release-openai' && secrets.OPENAI_API_KEY || '' }}
      R2_ACCESS_KEY_ID: ${{ (matrix.target == 'operational-release-r2' || matrix.target == 'operational-release-physical-modal-r2') && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ (matrix.target == 'operational-release-r2' || matrix.target == 'operational-release-physical-modal-r2') && secrets.R2_SECRET_ACCESS_KEY || '' }}
      R2_API_ENDPOINT: ${{ (matrix.target == 'operational-release-r2' || matrix.target == 'operational-release-physical-modal-r2') && vars.R2_API_ENDPOINT || '' }}
      R2_BUCKET: ${{ (matrix.target == 'operational-release-r2' || matrix.target == 'operational-release-physical-modal-r2') && vars.R2_BUCKET || '' }}
      MODAL_TOKEN_ID: ${{ (matrix.target == 'operational-release-modal' || matrix.target == 'operational-release-physical-modal-r2') && secrets.MODAL_TOKEN_ID || '' }}
      MODAL_TOKEN_SECRET: ${{ (matrix.target == 'operational-release-modal' || matrix.target == 'operational-release-physical-modal-r2') && secrets.MODAL_TOKEN_SECRET || '' }}
      MODAL_PROFILE: ${{ matrix.target == 'operational-release-modal' && vars.CODING_AGENT_MODAL_PROFILE || '' }}
      CODING_AGENT_MODAL_WORKSPACE: ${{ (matrix.target == 'operational-release-modal' || matrix.target == 'operational-release-physical-modal-r2') && vars.CODING_AGENT_MODAL_WORKSPACE || '' }}
      CODING_AGENT_MODAL_ENVIRONMENT: ${{ (matrix.target == 'operational-release-modal' || matrix.target == 'operational-release-physical-modal-r2') && vars.CODING_AGENT_MODAL_ENVIRONMENT || '' }}
      MODAL_ENVIRONMENT: ${{ (matrix.target == 'operational-release-modal' || matrix.target == 'operational-release-physical-modal-r2') && vars.CODING_AGENT_MODAL_ENVIRONMENT || '' }}
      CODING_AGENT_MODAL_APP: ${{ matrix.target == 'operational-release-modal' && vars.CODING_AGENT_MODAL_APP || '' }}
      CODING_AGENT_MODAL_IMAGE_ID: ${{ matrix.target == 'operational-release-modal' && vars.CODING_AGENT_MODAL_IMAGE_ID || '' }}
      CODEX_AUTH_VOLUME: ${{ matrix.target == 'operational-release-modal' && vars.CODEX_AUTH_VOLUME || '' }}
      CODING_AGENT_GITHUB_SECRET: ${{ matrix.target == 'operational-release-modal' && vars.CODING_AGENT_GITHUB_SECRET || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - run: uv sync --all-packages --all-extras --group dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: .context/downloaded-release-evidence/
      - name: Restore exact artifact manifest
        run: cp .context/downloaded-release-evidence/release-artifact.json release-artifact.json
      - name: Verify Docker service
        if: matrix.target == 'operational-release-docker'
        run: docker info
      - name: Require release R2 configuration
        if: matrix.target == 'operational-release-r2' || matrix.target == 'operational-release-physical-modal-r2'
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_API_ENDPOINT"
          test -n "$R2_BUCKET"
          case "$R2_BUCKET" in
            */*) echo "R2_BUCKET must be a bucket name, not a path" >&2; exit 1 ;;
          esac
      - name: Verify physical retry visibility
        if: matrix.target == 'operational-release-r2'
        run: >-
          PYTHONPATH="${PYTHONPATH:-}:."
          uv run pytest -q tests/infrastructure/test_r2_idempotency.py
      - name: Run exact installed-artifact scenario
        run: make "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-${{ matrix.target }}-evidence
          path: |
            ${{ matrix.receipt }}
            operational-release-*-results.d/
          if-no-files-found: error

  apple-evidence:
    name: Release evidence (Biome + Apple Container)
    needs: release-profile
    env:
      # actions/setup-python's macOS distributions are non-relocatable and
      # require the hosted-runner-only /Users/runner/hostedtoolcache path.
      # Let uv provision Python in the current ephemeral runner user's cache.
      UV_PYTHON: "3.12"
    runs-on:
      group: archetype-release-macos
      labels:
        - self-hosted
        - macOS
        - ARM64
        - archetype-apple-container-macos-26
    environment: release-apple-macos
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - name: Provision Python 3.12 with uv
        run: |
          uv sync --python "3.12" --all-packages --all-extras --group dev
          uv run python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: .context/downloaded-release-evidence/
      - name: Restore exact artifact manifest
        run: cp .context/downloaded-release-evidence/release-artifact.json release-artifact.json
      - name: Run pinned Biome exact installed-artifact scenario
        run: make operational-release-biome
      - name: Start Apple Container service
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          command -v container
          container system start
          container system status
      - name: Run Apple Container exact installed-artifact scenario
        run: make operational-release-apple
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-operational-release-apple-evidence
          path: |
            operational-release-biome-results.json
            operational-release-apple-results.json
            operational-release-*-results.d/
          if-no-files-found: error
      - name: Stop Apple Container service
        if: always()
        run: container system stop

  python-compatibility:
    name: Python 3.13 compatibility
    needs: authorize-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep later `uv run` calls on 3.13 despite the developer-default
      # .python-version checked into the repository.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - run: uv sync --python "3.13" --all-packages --all-extras --group dev
      - name: Verify Python 3.13 interpreter
        run: >-
          uv run python -c
          'import sys;
          assert sys.version_info[:2] == (3, 13), sys.version'
      - run: make test

  release-evidence-gate:
    name: Exact release evidence
    needs: [release-profile, external-evidence, apple-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-operational-release-*-evidence
          path: evidence/
          merge-multiple: true
      - name: Verify complete exact-wheel evidence
        run: >-
          uvx --with packaging==26.1 python
          scripts/verify_release_evidence.py
          --manifest evidence/release-artifact.json
          --out release-evidence-summary.json
          evidence/operational-release-results.json
          evidence/operational-release-openai-results.json
          evidence/operational-release-docker-results.json
          evidence/operational-release-r2-results.json
          evidence/operational-release-biome-results.json
          evidence/operational-release-apple-results.json
          evidence/operational-release-modal-results.json
          evidence/operational-release-physical-modal-r2-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-summary
          path: release-evidence-summary.json
          if-no-files-found: error

  testpypi-preflight:
    name: TestPyPI exact-byte preflight
    needs: [authorize-release, release-evidence-gate, python-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Reauthorize the immutable release ref
        run: >-
          python scripts/verify_release_ref.py
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --repository "$GITHUB_REPOSITORY"
          --actor "$GITHUB_ACTOR"
          --triggering-actor "$GITHUB_TRIGGERING_ACTOR"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence/
      - name: Reject conflicting TestPyPI files
        run: >-
          uvx --from pypi-attestations==0.0.30 --with packaging==26.1 python
          scripts/verify_release_index.py
          preflight
          --manifest evidence/release-artifact.json
          --expected-commit "$GITHUB_SHA"
          --api-template
          'https://test.pypi.org/pypi/{distribution}/{version}/json'
          --integrity-template
          'https://test.pypi.org/integrity/{distribution}/{version}/{filename}/provenance'
          --publisher-repository VangelisTech/archetype
          --publisher-environment release-testpypi
          --attestation-repository https://github.com/VangelisTech/archetype
          --registry-artifact-host test-files.pythonhosted.org

  publish-testpypi:
    name: Publish attested artifacts to TestPyPI
    needs: [authorize-release, testpypi-preflight]
    if: github.actor == 'everettVT' && github.triggering_actor == 'everettVT'
    runs-on: ubuntu-latest
    environment: release-testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-archetype-ecs
          path: dist/
      - name: Reauthorize the remote release tag
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.authorize-release.outputs.tag_object_sha }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "release tag check failed: $*" >&2; exit 1; }

          [[ "$GITHUB_REPOSITORY" == "VangelisTech/archetype" ]] || fail "wrong repository"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || fail "workflow ref is not a tag"
          [[ "$GITHUB_REF_NAME" == "$RELEASE_INPUT_TAG" ]] || fail "input and ref differ"
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "tag must be canonical vMAJOR.MINOR.PATCH"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "GITHUB_SHA is not 40-hex"
          [[ "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]] || fail "authorized tag object is not 40-hex"

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == "$tag_ref" ]] || fail "workflow ref is not the exact tag ref"
          remote="https://github.com/VangelisTech/archetype.git"
          output="$(git ls-remote --exit-code "$remote" "$tag_ref" "$tag_ref^{}")"
          direct_sha=
          peeled_sha=
          while IFS= read -r line; do
            sha=
            ref=
            extra=
            IFS=$'\t' read -r sha ref extra <<< "$line"
            [[ -z "$extra" ]] || fail "malformed ls-remote output"
            [[ "$line" == "$sha"$'\t'"$ref" ]] || fail "malformed ls-remote output"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "remote SHA is not 40-hex"
            case "$ref" in
              "$tag_ref")
                [[ -z "$direct_sha" ]] || fail "duplicate direct tag ref"
                direct_sha="$sha"
                ;;
              "$tag_ref^{}")
                [[ -z "$peeled_sha" ]] || fail "duplicate peeled tag ref"
                peeled_sha="$sha"
                ;;
              *) fail "unexpected remote ref $ref" ;;
            esac
          done <<< "$output"
          [[ -n "$direct_sha" ]] || fail "direct tag ref is absent"
          [[ "$direct_sha" == "$EXPECTED_TAG_OBJECT" ]] || fail "remote tag object differs"
          resolved_sha="${peeled_sha:-$direct_sha}"
          [[ "$resolved_sha" == "$GITHUB_SHA" ]] || fail "remote tag commit differs"
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true

  publish-testpypi-libraries:
    name: Publish independently attested distributions to TestPyPI
    needs: [authorize-release, testpypi-preflight, publish-testpypi]
    if: github.actor == 'everettVT' && github.triggering_actor == 'everettVT'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Dispatch exact TestPyPI publisher runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/dispatch_release_publishers.py dispatch
          --parent-run-id "$GITHUB_RUN_ID"
          --parent-run-attempt "$GITHUB_RUN_ATTEMPT"
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --registry testpypi
          --out publisher-dispatch-testpypi.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-dispatch-testpypi-${{ github.run_attempt }}
          path: publisher-dispatch-testpypi.json
          if-no-files-found: error
      - name: Await only the allowlisted TestPyPI publisher runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/dispatch_release_publishers.py await
          --parent-run-id "$GITHUB_RUN_ID"
          --parent-run-attempt "$GITHUB_RUN_ATTEMPT"
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --registry testpypi
          --allowlist publisher-dispatch-testpypi.json
          --out publisher-dispatch-testpypi.json

  testpypi-smoke:
    name: TestPyPI installed distribution matrix
    needs: [publish-testpypi, publish-testpypi-libraries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence/
      - name: Verify TestPyPI serves all ten attested files
        run: >-
          uvx --from pypi-attestations==0.0.30 --with packaging==26.1 python
          scripts/verify_release_index.py
          complete
          --manifest evidence/release-artifact.json
          --expected-commit "$GITHUB_SHA"
          --api-template
          'https://test.pypi.org/pypi/{distribution}/{version}/json'
          --integrity-template
          'https://test.pypi.org/integrity/{distribution}/{version}/{filename}/provenance'
          --publisher-repository VangelisTech/archetype
          --publisher-environment release-testpypi
          --attestation-repository https://github.com/VangelisTech/archetype
          --registry-artifact-host test-files.pythonhosted.org
          --out testpypi-index-evidence.json
          --attempts 12
          --interval-seconds 5
      - name: Install base, selective, full-stack, and isolated Smol packages from TestPyPI
        run: >-
          uv run --no-project --with packaging==26.1 python scripts/registry_smoke.py
          --manifest evidence/release-artifact.json
          --index-url https://test.pypi.org/simple
          --extra-index-url https://pypi.org/simple
          --out testpypi-install-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testpypi-index-evidence
          path: |
            testpypi-index-evidence.json
            testpypi-install-evidence.json
          if-no-files-found: error

  pypi-preflight:
    name: PyPI exact-byte preflight
    needs: [authorize-release, testpypi-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Reauthorize the immutable release ref
        run: >-
          python scripts/verify_release_ref.py
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --repository "$GITHUB_REPOSITORY"
          --actor "$GITHUB_ACTOR"
          --triggering-actor "$GITHUB_TRIGGERING_ACTOR"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence/
      - name: Reject conflicting PyPI files
        run: >-
          uvx --from pypi-attestations==0.0.30 --with packaging==26.1 python
          scripts/verify_release_index.py
          preflight
          --manifest evidence/release-artifact.json
          --expected-commit "$GITHUB_SHA"
          --integrity-template
          'https://pypi.org/integrity/{distribution}/{version}/{filename}/provenance'
          --publisher-repository VangelisTech/archetype
          --publisher-environment release-pypi
          --attestation-repository https://github.com/VangelisTech/archetype
          --registry-artifact-host files.pythonhosted.org

  publish:
    needs: [authorize-release, pypi-preflight]
    if: github.actor == 'everettVT' && github.triggering_actor == 'everettVT'
    runs-on: ubuntu-latest
    environment: release-pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-archetype-ecs
          path: dist/
      - name: Reauthorize the remote release tag
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.authorize-release.outputs.tag_object_sha }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "release tag check failed: $*" >&2; exit 1; }

          [[ "$GITHUB_REPOSITORY" == "VangelisTech/archetype" ]] || fail "wrong repository"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || fail "workflow ref is not a tag"
          [[ "$GITHUB_REF_NAME" == "$RELEASE_INPUT_TAG" ]] || fail "input and ref differ"
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "tag must be canonical vMAJOR.MINOR.PATCH"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "GITHUB_SHA is not 40-hex"
          [[ "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]] || fail "authorized tag object is not 40-hex"

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == "$tag_ref" ]] || fail "workflow ref is not the exact tag ref"
          remote="https://github.com/VangelisTech/archetype.git"
          output="$(git ls-remote --exit-code "$remote" "$tag_ref" "$tag_ref^{}")"
          direct_sha=
          peeled_sha=
          while IFS= read -r line; do
            sha=
            ref=
            extra=
            IFS=$'\t' read -r sha ref extra <<< "$line"
            [[ -z "$extra" ]] || fail "malformed ls-remote output"
            [[ "$line" == "$sha"$'\t'"$ref" ]] || fail "malformed ls-remote output"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "remote SHA is not 40-hex"
            case "$ref" in
              "$tag_ref")
                [[ -z "$direct_sha" ]] || fail "duplicate direct tag ref"
                direct_sha="$sha"
                ;;
              "$tag_ref^{}")
                [[ -z "$peeled_sha" ]] || fail "duplicate peeled tag ref"
                peeled_sha="$sha"
                ;;
              *) fail "unexpected remote ref $ref" ;;
            esac
          done <<< "$output"
          [[ -n "$direct_sha" ]] || fail "direct tag ref is absent"
          [[ "$direct_sha" == "$EXPECTED_TAG_OBJECT" ]] || fail "remote tag object differs"
          resolved_sha="${peeled_sha:-$direct_sha}"
          [[ "$resolved_sha" == "$GITHUB_SHA" ]] || fail "remote tag commit differs"
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true
          attestations: true

  publish-libraries:
    name: Publish independently attested distributions to PyPI
    needs: [authorize-release, pypi-preflight, publish]
    if: github.actor == 'everettVT' && github.triggering_actor == 'everettVT'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Dispatch exact PyPI publisher runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/dispatch_release_publishers.py dispatch
          --parent-run-id "$GITHUB_RUN_ID"
          --parent-run-attempt "$GITHUB_RUN_ATTEMPT"
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --registry pypi
          --out publisher-dispatch-pypi.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-dispatch-pypi-${{ github.run_attempt }}
          path: publisher-dispatch-pypi.json
          if-no-files-found: error
      - name: Await only the allowlisted PyPI publisher runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/dispatch_release_publishers.py await
          --parent-run-id "$GITHUB_RUN_ID"
          --parent-run-attempt "$GITHUB_RUN_ATTEMPT"
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --registry pypi
          --allowlist publisher-dispatch-pypi.json
          --out publisher-dispatch-pypi.json

  registry-smoke:
    name: PyPI installed distribution matrix
    needs: [publish, publish-libraries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.28"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence/
      - name: Verify PyPI serves all ten attested files
        run: >-
          uvx --from pypi-attestations==0.0.30 --with packaging==26.1 python
          scripts/verify_release_index.py
          complete
          --manifest evidence/release-artifact.json
          --expected-commit "$GITHUB_SHA"
          --integrity-template
          'https://pypi.org/integrity/{distribution}/{version}/{filename}/provenance'
          --publisher-repository VangelisTech/archetype
          --publisher-environment release-pypi
          --attestation-repository https://github.com/VangelisTech/archetype
          --registry-artifact-host files.pythonhosted.org
          --out pypi-index-evidence.json
          --attempts 12
          --interval-seconds 5
      - name: Install base, selective, full-stack, and isolated Smol packages from PyPI
        run: >-
          uv run --no-project --with packaging==26.1 python scripts/registry_smoke.py
          --manifest evidence/release-artifact.json
          --out pypi-install-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-index-evidence
          path: |
            pypi-index-evidence.json
            pypi-install-evidence.json
          if-no-files-found: error

  github-release:
    needs: [authorize-release, registry-smoke]
    if: github.actor == 'everettVT' && github.triggering_actor == 'everettVT'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Reauthorize the immutable release ref before GitHub Release creation
        run: >-
          python scripts/verify_release_ref.py
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"
          --expected-tag-object "${{ needs.authorize-release.outputs.tag_object_sha }}"
          --repository "$GITHUB_REPOSITORY"
          --actor "$GITHUB_ACTOR"
          --triggering-actor "$GITHUB_TRIGGERING_ACTOR"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
