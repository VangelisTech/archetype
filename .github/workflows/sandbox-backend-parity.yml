name: Sandbox backend parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # This advisory PR substrate proof follows every package that can change
    # mission sandbox behavior. The retained release scenario is separately
    # owned by the operational manifest and runner.
    paths:
      - "src/archetype/missions/**"
      - "src/archetype/app/missions/**"
      - "src/archetype/runtime/**"
      - "src/archetype/commands/**"
      - "src/archetype/world/**"
      - "src/archetype/app/world/**"
      - "src/archetype/graph/**"
      - "src/archetype/core/hooks.py"
      - "src/archetype/wiring.py"
      - "src/archetype/app/container.py"
      - "examples/11_coding_agent_mission.py"
      - "evals/suites/capability/agent_missions.py"
      - "tests/missions/**"
      - "tests/integration/test_agent_mission_service.py"
      - "tests/integration/test_docker_sandbox_parity.py"
      - "quality/operational_scenarios.toml"
      - "uv.lock"
      - ".github/workflows/sandbox-backend-parity.yml"

permissions:
  contents: read

concurrency:
  group: sandbox-backend-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-checkpoint-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: docker info
      - name: Verify session-filesystem checkpoint and restore
        env:
          ARCHETYPE_DOCKER_SANDBOX_PARITY: "1"
        run: >-
          uv run pytest -q
          tests/integration/test_docker_sandbox_parity.py
