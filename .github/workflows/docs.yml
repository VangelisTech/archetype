name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/generate_*.py"
      - "src/archetype/api/**"
      - "src/archetype/cli/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/generate_*.py"
      - "src/archetype/api/**"
      - "src/archetype/cli/**"
      - ".markdownlint.yaml"
      - "_typos.toml"
      - "lychee.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Spelling — typos-cli (~2s, Rust binary)
  # --------------------------------------------------------------------------
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
        with:
          config: ./_typos.toml

  # --------------------------------------------------------------------------
  # Markdown lint — markdownlint-cli2
  # --------------------------------------------------------------------------
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint.yaml
          globs: |
            docs/**/*.md
            *.md

  # --------------------------------------------------------------------------
  # Link check — lychee
  # --------------------------------------------------------------------------
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            "docs/"
            "README.md"
            "CONTRIBUTING.md"
            "AGENTS.md"
          fail: true

  # --------------------------------------------------------------------------
  # Build docs — MkDocs + auto-generated references
  # --------------------------------------------------------------------------
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Generate API & CLI reference
        run: |
          uv run python scripts/generate_api_docs.py
          uv run python scripts/generate_cli_docs.py

      - name: Build MkDocs
        run: uv run --extra docs mkdocs build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  # --------------------------------------------------------------------------
  # Deploy to Cloudflare Pages
  #   push to main  → production (archetype.vangelis.tech)
  #   pull request   → preview   (<hash>.archetype-docs.pages.dev)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Skip on fork PRs — secrets are not available.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create GitHub deployment
        id: gh-deploy
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const env = isPR ? 'docs-preview' : 'docs-production';
            const ref = isPR ? context.payload.pull_request.head.sha : context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              auto_merge: false,
              required_contexts: [],
              transient_environment: isPR,
              production_environment: !isPR,
              description: isPR ? `Docs preview for PR #${context.issue.number}` : 'Docs production deploy',
            });
            core.setOutput('deployment-id', deployment.data.id);

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f11df81ebc1ba9b7450c59398474827a
        run: |
          set -o pipefail
          npx --yes wrangler pages deploy site/ \
            --project-name=archetype-docs \
            --branch=${{ github.head_ref || 'main' }} \
            --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          url=$(grep -oP 'https://[a-z0-9-]+\.archetype-docs\.pages\.dev' /tmp/deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No deployment URL found in wrangler output"
            exit 1
          fi
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.gh-deploy.outputs.deployment-id }},
              state: 'success',
              environment_url: '${{ steps.deploy.outputs.deployment-url }}',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Docs deployed to Cloudflare Pages',
            });

      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.gh-deploy.outputs.deployment-id }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Cloudflare Pages deploy failed',
            });
