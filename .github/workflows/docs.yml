name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/**"
      # The generated Python, CLI, and REST references derive from source.
      - "packages/*/src/archetype/**"
      - ".github/workflows/docs.yml"
  # Every PR base is intentional: dependent/stacked PRs need their own evidence.
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "_typos.toml"
      - ".markdownlint.yaml"
      - "lychee.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Spelling — typos-cli (~2s, Rust binary)
  # --------------------------------------------------------------------------
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          config: ./_typos.toml

  # --------------------------------------------------------------------------
  # Markdown lint — markdownlint-cli2
  # --------------------------------------------------------------------------
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          config: .markdownlint.yaml
          globs: |
            docs/**/*.md
            *.md

  # --------------------------------------------------------------------------
  # Link check — lychee
  # --------------------------------------------------------------------------
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            "docs/"
            "README.md"
            "CONTRIBUTING.md"
            "AGENTS.md"
          fail: true

  # --------------------------------------------------------------------------
  # Build docs — MkDocs + auto-generated references
  # --------------------------------------------------------------------------
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --group docs

      - name: Build docs site
        run: make docs

      - name: Verify Cloudflare Pages files
        run: |
          for f in _headers _redirects index.html 404.html docs/index.html; do
            if [ ! -f "site/$f" ]; then
              echo "::error::site/$f missing from the production artifact"
              exit 1
            fi
          done
          echo "Cloudflare Pages artifact contains the landing page and /docs site"

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site/

  # --------------------------------------------------------------------------
  # Deploy to Cloudflare Pages
  #   push to main  → production (archetype.vangelis.tech)
  #   pull request   → preview   (<hash>.archetype-docs.pages.dev)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Skip on fork PRs — secrets are not available.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Create GitHub deployment
        id: gh-deploy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const env = isPR ? 'docs-preview' : 'docs-production';
            const ref = isPR ? context.payload.pull_request.head.sha : context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: env,
              auto_merge: false,
              required_contexts: [],
              transient_environment: isPR,
              production_environment: !isPR,
              description: isPR ? `Docs preview for PR #${context.issue.number}` : 'Docs production deploy',
            });
            core.setOutput('deployment-id', deployment.data.id);

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f11df81ebc1ba9b7450c59398474827a
          DOCS_DEPLOY_BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          set -o pipefail
          npx --yes wrangler pages deploy site/ \
            --project-name=archetype-docs \
            --branch="$DOCS_DEPLOY_BRANCH" \
            --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          url=$(grep -oP 'https://[a-z0-9-]+\.archetype-docs\.pages\.dev' /tmp/deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No deployment URL found in wrangler output"
            exit 1
          fi
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      # A CNAME file in the repository is a GitHub Pages convention; it does
      # not attach a hostname to a Cloudflare Pages project. Keep the Pages
      # association in the deployment workflow so the real custom-domain
      # configuration cannot drift from the public site URL in mkdocs.yml.
      - name: Ensure production custom domain
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f11df81ebc1ba9b7450c59398474827a
          CUSTOM_DOMAIN: archetype.vangelis.tech
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/archetype-docs/domains"
          status="$(curl --silent --show-error --output /tmp/pages-domains.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$endpoint")"
          if [ "$status" != "200" ]; then
            echo "::error::Could not inspect Cloudflare Pages domains (HTTP $status)"
            cat /tmp/pages-domains.json
            exit 1
          fi
          if node -e '
            const fs = require("fs");
            const response = JSON.parse(fs.readFileSync("/tmp/pages-domains.json", "utf8"));
            if (!response.success) process.exit(2);
            process.exit(response.result.some((domain) => domain.name === process.env.CUSTOM_DOMAIN) ? 0 : 1);
          '; then
            echo "Cloudflare Pages custom domain already configured: ${CUSTOM_DOMAIN}"
          else
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"${CUSTOM_DOMAIN}\"}" \
              "$endpoint"
            echo "Requested Cloudflare Pages custom domain: ${CUSTOM_DOMAIN}"
          fi

      # Pages associates the hostname with the project, but the DNS record is
      # still required for a subdomain to resolve. Manage that single record
      # here as well so the public hostname cannot remain pending after a
      # successful production deploy.
      - name: Ensure production DNS record
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CUSTOM_DOMAIN: archetype.vangelis.tech
          ZONE_NAME: vangelis.tech
          PAGES_HOST: archetype-docs.pages.dev
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_DNS_API_TOKEN}" ]; then
            echo "::warning::Set CLOUDFLARE_DNS_API_TOKEN (Zone:Read and DNS:Edit for vangelis.tech) to provision ${CUSTOM_DOMAIN}."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth=(--header "Authorization: Bearer ${CLOUDFLARE_DNS_API_TOKEN}")

          curl --fail-with-body --silent --show-error --get \
            "${auth[@]}" \
            --data-urlencode "name=${ZONE_NAME}" \
            --output /tmp/zones.json \
            "${api}/zones"
          zone_id="$(node -e '
            const fs = require("fs");
            const response = JSON.parse(fs.readFileSync("/tmp/zones.json", "utf8"));
            const zones = response.result?.filter((zone) => zone.name === process.env.ZONE_NAME) ?? [];
            if (!response.success || zones.length !== 1) {
              console.error(`Expected one Cloudflare zone named ${process.env.ZONE_NAME}`);
              process.exit(1);
            }
            process.stdout.write(zones[0].id);
          ')"

          curl --fail-with-body --silent --show-error --get \
            "${auth[@]}" \
            --data-urlencode "name=${CUSTOM_DOMAIN}" \
            --output /tmp/dns-records.json \
            "${api}/zones/${zone_id}/dns_records"
          record_id="$(node -e '
            const fs = require("fs");
            const response = JSON.parse(fs.readFileSync("/tmp/dns-records.json", "utf8"));
            const records = response.result ?? [];
            if (!response.success || records.length > 1 || records.some((record) => record.type !== "CNAME")) {
              console.error(`Refusing to replace existing DNS records for ${process.env.CUSTOM_DOMAIN}`);
              process.exit(1);
            }
            if (records.length === 1) process.stdout.write(records[0].id);
          ')"
          payload="$(node -e '
            console.log(JSON.stringify({
              type: "CNAME",
              name: process.env.CUSTOM_DOMAIN,
              content: process.env.PAGES_HOST,
              proxied: true,
              ttl: 1,
            }));
          ')"

          if [ -n "${record_id}" ]; then
            method="PUT"
            endpoint="${api}/zones/${zone_id}/dns_records/${record_id}"
          else
            method="POST"
            endpoint="${api}/zones/${zone_id}/dns_records"
          fi
          curl --fail-with-body --silent --show-error \
            "${auth[@]}" \
            --header "Content-Type: application/json" \
            --request "${method}" \
            --data "${payload}" \
            "${endpoint}"
          echo "Ensured proxied CNAME ${CUSTOM_DOMAIN} -> ${PAGES_HOST}"

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.gh-deploy.outputs.deployment-id }},
              state: 'success',
              environment_url: '${{ steps.deploy.outputs.deployment-url }}',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Docs deployed to Cloudflare Pages',
            });

      - name: Update deployment status (failure)
        if: failure() && steps.gh-deploy.outputs.deployment-id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          DEPLOYMENT_ID: ${{ steps.gh-deploy.outputs.deployment-id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Cloudflare Pages deploy failed',
            });
