name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/generate_*.py"
      - "src/archetype/api/**"
      - "src/archetype/cli/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/generate_*.py"
      - ".markdownlint.yaml"
      - "_typos.toml"
      - "lychee.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Spelling — typos-cli (~2s, Rust binary)
  # --------------------------------------------------------------------------
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
        with:
          config: ./_typos.toml

  # --------------------------------------------------------------------------
  # Markdown lint — markdownlint-cli2
  # --------------------------------------------------------------------------
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint.yaml
          globs: |
            docs/**/*.md
            *.md

  # --------------------------------------------------------------------------
  # Link check — lychee
  # --------------------------------------------------------------------------
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            "docs/**/*.md"
            "*.md"
          fail: true

  # --------------------------------------------------------------------------
  # Build docs — MkDocs + auto-generated references
  # --------------------------------------------------------------------------
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Generate API & CLI reference
        run: |
          uv run python scripts/generate_api_docs.py
          uv run python scripts/generate_cli_docs.py

      - name: Build MkDocs
        run: uv run --extra docs mkdocs build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  # --------------------------------------------------------------------------
  # Deploy to Cloudflare Pages — only on push to main
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f11df81ebc1ba9b7450c59398474827a
          command: pages deploy site/ --project-name=archetype-docs
