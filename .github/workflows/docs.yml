name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/generate_*.py"
      - "src/archetype/api/**"
      - "src/archetype/cli/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/generate_*.py"
      - ".markdownlint.yaml"
      - "_typos.toml"
      - "lychee.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Spelling — typos-cli (~2s, Rust binary)
  # --------------------------------------------------------------------------
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
        with:
          config: ./_typos.toml

  # --------------------------------------------------------------------------
  # Markdown lint — markdownlint-cli2
  # --------------------------------------------------------------------------
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint.yaml
          globs: |
            docs/**/*.md
            *.md

  # --------------------------------------------------------------------------
  # Link check — lychee
  # --------------------------------------------------------------------------
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --glob-ignore-case
            "docs/**/*.md"
            "./*.md"
          fail: true

  # --------------------------------------------------------------------------
  # Build docs — MkDocs + auto-generated references
  # --------------------------------------------------------------------------
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Generate API & CLI reference
        run: |
          uv run python scripts/generate_api_docs.py
          uv run python scripts/generate_cli_docs.py

      - name: Build MkDocs
        run: uv run --extra docs mkdocs build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  # --------------------------------------------------------------------------
  # Deploy to Cloudflare Pages
  #   push to main  → production (archetype.vangelis.tech)
  #   pull request   → preview   (<hash>.archetype-docs.pages.dev)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f11df81ebc1ba9b7450c59398474827a
        run: |
          npx --yes wrangler pages deploy site/ \
            --project-name=archetype-docs \
            --branch=${{ github.head_ref || 'main' }} \
            --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          url=$(grep -oP 'https://[a-z0-9]+\.archetype-docs\.pages\.dev' /tmp/deploy.log || echo "https://archetype-docs.pages.dev")
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 📄 Docs preview\n\nDeployed to Cloudflare Pages:\n${{ steps.deploy.outputs.deployment-url }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Docs preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
