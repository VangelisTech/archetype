name: Modal Coding Agent Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/11_coding_agent_mission.py"

permissions:
  contents: read

concurrency:
  group: modal-coding-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-modal:
    name: Claude Code + Codex on Modal
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --extra coding-agent

      - name: Verify Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Run live Modal coding-agent integrations
        run: make test-modal
