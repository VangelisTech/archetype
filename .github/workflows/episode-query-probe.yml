name: Episode query probe
on:
  push:
    branches: [codex/git-episode-query-20261009]
jobs:
  daft-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 daft==0.7.19
      - run: PYTHONPATH=. python -m pytest -q packages/archetype-ecs/tests/test_episode_query_example.py
