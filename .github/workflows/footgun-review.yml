name: Footgun Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: footgun-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  footgun:
    # Skip PRs from forks — they don't get access to ANTHROPIC_API_KEY.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run footgun-detector
        id: footgun-detector
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are running in CI on PR #${{ github.event.pull_request.number }}.

            Invoke the `footgun-detector` subagent (defined in
            `.claude/agents/footgun-detector.md`) via the Task tool to review
            this PR's diff. Pass the PR number so it fetches the diff with
            `gh pr diff ${{ github.event.pull_request.number }}`.

            After the subagent returns, report its findings so the branch
            ruleset's required-thread-resolution rule enforces them:

            - If it reports one or more footguns, post ONE pull-request
              review whose inline comments carry the findings — inline
              review comments create resolvable threads, and the merge is
              blocked until each is resolved. Build a JSON file and submit:
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input review.json`
              with shape:
              `{"event":"COMMENT","body":"## Footgun review\n\n<n> finding(s), posted inline. Address and resolve each thread.","comments":[{"path":"<file>","line":<line>,"body":"<full finding incl. its **Fix:** verbatim>"}]}`
              Every comment's path+line MUST be a line present in the PR
              diff. If a finding's exact line is not in the diff, anchor it
              to the nearest changed line in that file; if the file has no
              changed lines, fold that finding into the review `body`
              instead. If the review API call fails, fall back to
              `gh pr comment` with the full findings so nothing is lost.
            - If it reports "No footguns detected in this diff.", post a
              single short comment via `gh pr comment`:
              `## Footgun review\n\nNo notes.` (No thread — nothing to
              resolve.)

            Do not edit any files. Do not run tests. Do not push commits.
            This job is advisory and must not fail the build on findings —
            enforcement happens through thread resolution, not job status.

      - name: Report footgun-detector failure
        if: steps.footgun-detector.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/footgun-review-failed.md <<EOF
          ## Footgun review

          Footgun review did not complete. This advisory check is non-blocking; inspect the workflow log for details:
          ${RUN_URL}
          EOF
          gh pr comment "${PR_NUMBER}" --body-file /tmp/footgun-review-failed.md
