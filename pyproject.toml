[project]
name = "archetype"
version = "0.1.0"
description = "AI-native simulation engine: ECS as data (Daft) with time-travel storage (LanceDB)."
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vangelis Technologies Inc.", email = "everett@vangelis.tech" },
]
keywords = ["simulation", "ecs", "reinforcement-learning", "llm", "daft", "lancedb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "daft[openai,google,lance,iceberg,sql,unity]==0.7.1",
    "lancedb>=0.22.0",
    "pyiceberg[daft,sql-sqlite]>=0.7.0,<0.9.1",
    "unitycatalog-client>=0.3.0",
    "uuid-utils>=0.11.0",
    "igraph",
    "psutil",
    "torch>=2.6.0",
    "safetensors>=0.5.3",
    "mcp>=1.25.0",
]

[project.optional-dependencies]
ray        = ["ray[default]>=2.47", "fastapi>=0.110", "uvicorn[standard]>=0.29"]
inference  = ["ray[serve,llm]>=2.47", "vllm>=0.7.2", "huggingface-hub>=0.26", "transformers>=4.49", "accelerate>=0.29", "datasets>=3.6"]
benchmark  = ["esper>=2.45"]
otel       = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
dev        = [
    "pytest>=8.3", "pytest-asyncio>=0.26", "pytest-cov>=5.0",
    "ruff>=0.9",
    "matplotlib>=3.9",
    "viztracer>=1.0.4",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [
    "src"
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["archetype"]
omit = [
    "tests/*",
]
disable_warnings = [
    "module-not-measured",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 60

[tool.coverage.xml]
output = "coverage.xml"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "archetype_data",
    ".archetype_meta",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E731",   # Lambda assignment (used in DSL filter= pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
