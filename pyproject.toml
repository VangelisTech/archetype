[project]
name = "archetype-workspace"
version = "0.6.2"
description = "Development workspace for the Archetype framework, first-party world libraries, and independent Smol teaching engine."
requires-python = ">=3.12"
dependencies = [
    "archetype-ecs[all,coding-agent,logfire,sim]==0.6.1",
    "archetype-smol==0.6.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "tests",
    "packages/archetype-ecs/tests",
    "packages/archetype-missions/tests",
    "packages/archetype-physical-ai/tests",
    "packages/archetype-research/tests",
    "packages/archetype-smol/tests",
]
python_files = ["test_*.py"]
pythonpath = [
    "packages/archetype-ecs/src",
    "packages/archetype-missions/src",
    "packages/archetype-physical-ai/src",
    "packages/archetype-research/src",
    "packages/archetype-smol/src",
    ".",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: focused evidence at one local seam",
    "contract(id): approved normative behavior identified in quality/contracts.toml",
    "integration: multiple real repository layers",
    "race: deterministically coordinated concurrency schedule",
    "process: subprocess, crash, or independent-writer behavior",
    "smoke: shallow public-path or built-artifact evidence",
    "external: credentials or external infrastructure required",
    "slow: unsuitable for the quick local profile",
    "modal: paid, user-triggered tests against live Modal infrastructure",
]

[tool.coverage.run]
branch = true
source = ["archetype"]
omit = [
    "tests/*",
    # Re-export stubs
    "packages/archetype-ecs/src/archetype/core/storage/storage.py",
]
disable_warnings = [
    "module-not-measured",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 70

[tool.coverage.xml]
output = "coverage.xml"

[dependency-groups]
problem-definition = [
    # Experimental example-only prompt optimizer; not shipped as a runtime dependency.
    "gepa==0.1.1",
]
dev = [
    { include-group = "problem-definition" },
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26",
    "pytest-cov>=5.0",
    "ruff>=0.15,<0.16",  # pinned: 0.15 introduced I001/B007 rule changes; keep local == CI
    "httpx>=0.27",
    "pre-commit>=4.0",
    "mutmut>=3.5",
    "mujoco>=3.2",  # physics parity tests (tests/physical_ai/test_mujoco_rollout.py)
    "pytest-xdist>=3.8.0",
    # Dev keeps the optional Logfire backend installed so CI can exercise the
    # explicit host adapter; the published base package remains vendor-neutral.
    "logfire[fastapi]>=4.32.0",
    "python-dotenv>=1.2.2",
    "setuptools>=83.0.0",
    # Blocking quality gate for the complete uv lock projection.
    "pip-audit==2.10.1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocs-mermaid2-plugin",
    "mkdocstrings[python]>=0.27",
    "pymdown-extensions>=11.0",
]
benchmark = [
    "esper>=2.45",
    "matplotlib>=3.9",
    "viztracer>=1.0.4",
]

# Mutation testing. Scoped narrowly: mutmut runs each mutation as a full
# test process, so a whole-codebase sweep can take hours. The pilot scope
# below is intentionally tight — expand it as the workflow proves out.
# See docs/guide/mutation-testing.md for usage and the rationale.
[tool.mutmut]
paths_to_mutate = [
    "packages/archetype-ecs/src/archetype/core/component.py",
    "packages/archetype-ecs/src/archetype/core/archetype.py",
]
tests_dir = [
    "tests/core/test_component_core.py",
    "tests/core/test_archetype_core_signatures.py",
]
# pytest's [tool.pytest.ini_options].pythonpath puts mutants/src first on
# sys.path, so the rest of the archetype package has to be staged into
# mutants/ as well — otherwise tests/conftest.py fails to import
# other packages. mutmut writes the mutated component.py *after*
# also_copy runs, so the unmutated copy here is harmlessly overwritten.
also_copy = [
    "packages/archetype-ecs/src/archetype",
]
# Run only the pilot's tests, quietly. The default test selection is
# the whole tests/ tree, which would re-run the full suite per mutant.
pytest_add_cli_args = ["-q", "--no-header", "-x"]
do_not_mutate = [
    "*/__init__.py",
]

[tool.uv]
package = false
# Supply-chain guard: refuse packages released after this date (7-day quarantine).
# Bump this manually as needed; uv 0.8.x doesn't support relative durations.
exclude-newer = "2026-06-12T00:00:00Z"
# Surgical exceptions to the freeze — one package, one dated ceiling, so the
# quarantine holds for everything else. daft 0.7.19 released 2026-07-10;
# admitted explicitly (Everett, 2026-07-14) for the 0.2.0 release.
[tool.uv.exclude-newer-package]
daft = "2026-07-11T00:00:00Z"
# Modal 1.5.2 adds port-scoped Sandbox Connect Tokens required for separately
# authenticated spectate and takeover viewports.
modal = "2026-07-11T00:00:00Z"
synchronicity = "2026-07-11T00:00:00Z"
# starlette 1.3.1 released 2026-06-12, 9h past the freeze; admitted for the
# CVE-2026-54283 fix — dependabot alert #95 (security bumps, 2026-07-16).
starlette = "2026-06-13T00:00:00Z"
# Security releases admitted past the quarantine ceiling for the next release.
# Each ceiling is the day after the fixed release rather than a general
# relaxation of the repository quarantine. This covers Dependabot alerts
# #116-117 (pypdf), #112 (msgpack), and #98-110 (Pillow), plus the blocking
# lockfile advisories recorded by the security audit.
msgpack = "2026-06-19T00:00:00Z"
aiohttp = "2026-07-24T00:00:00Z"
h2 = "2026-08-04T00:00:00Z"
hpack = "2026-06-24T00:00:00Z"
pymdown-extensions = "2026-07-03T00:00:00Z"
pypdf = "2026-08-07T00:00:00Z"
setuptools = "2026-07-05T00:00:00Z"
pillow = "2026-07-02T00:00:00Z"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
archetype-ecs = { workspace = true }
archetype-missions = { workspace = true }
archetype-physical-ai = { workspace = true }
archetype-research = { workspace = true }
archetype-smol = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "archetype_data",
    ".archetype_meta",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
# The workspace root is intentionally not a Python package, so declare the
# repository-owned import roots instead of relying on Ruff's single-src-root
# inference.
known-first-party = ["archetype", "bench", "evals", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"packages/archetype-ecs/src/archetype/api/routes/*.py" = ["B008"]  # Depends() in defaults is standard FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# ty follows imports from a project root rather than honoring pre-commit's
# `files:` filter, so scope the checked source set here. This keeps ty off
# bench/evals/experiments/examples/scripts and the vendored .venv/stdlib stubs.
include = [
    "packages/archetype-ecs/src",
    "packages/archetype-missions/src",
    "packages/archetype-physical-ai/src",
    "packages/archetype-research/src",
    "packages/archetype-smol/src",
]
respect-ignore-files = true

[tool.ty.rules]
# Optional deps imported lazily inside functions (e.g. matplotlib in periphery).
unresolved-import = "ignore"

# Every other rule runs at its default ("error") level — the codebase is clean.
# Known false positives carry a targeted inline `# ty: ignore[rule]` with a
# comment naming the cause (mostly Daft stubs typing Expression.__eq__/__gt__
# as bool, plus a few deliberate hasattr/duck-typing probes). Suppress new
# findings inline the same way — do not down-level rules here.
