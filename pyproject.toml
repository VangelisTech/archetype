[project]
name = "archetype-ecs"
version = "0.1.1"
description = "AI-native simulation engine: ECS as data (Daft) with time-travel storage (LanceDB)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vangelis Technologies Inc.", email = "everett@vangelis.tech" },
]
keywords = ["simulation", "ecs", "reinforcement-learning", "llm", "daft", "lancedb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "daft[openai,lance,iceberg]>=0.7.4",
    "lancedb>=0.22.0",
    "pyiceberg[daft,sql-sqlite]",
    "uuid-utils>=0.11.0",
    "psutil>=5.9",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.9",
    "httpx>=0.27",
]

[project.scripts]
archetype = "archetype.cli.main:app"

[project.optional-dependencies]
benchmark  = ["esper>=2.45"]
otel       = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
dev        = [
    "pytest>=8.3", "pytest-asyncio>=0.26", "pytest-cov>=5.0",
    "ruff>=0.9",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "viztracer>=1.0.4",
    "ipykernel",
]
docs       = [
    "mkdocs-shadcn",
    "mkdocs-mermaid2-plugin",
    "mkdocstrings[python]>=0.27",
    "pymdown-extensions",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [
    "src"
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["archetype"]
omit = [
    "tests/*",
    # Re-export stubs
    "src/archetype/core/storage/storage.py",
]
disable_warnings = [
    "module-not-measured",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 70

[tool.coverage.xml]
output = "coverage.xml"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "httpx>=0.27",
    "pre-commit>=4.0",
]

[tool.uv]
# Only resolve packages released at least 7 days ago.
# Updated by `make lock-refresh` or CI.
exclude-newer = "2026-04-07T00:00:00Z"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "archetype_data",
    ".archetype_meta",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"src/archetype/api/routes/*.py" = ["B008"]  # Depends() in defaults is standard FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
