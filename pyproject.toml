[project]
name = "archetype"
version = "0.1.0"
description = "Lazy Distributed Dataframe-Based ECS Simulation Engine using Daft for processing and LanceDB for storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "daft[lance,iceberg,sql]>=0.5.2",
    "pyarrow>=16.0.0",
    "lancedb>=0.22.0",
    "python-ulid>=3.0.0",
    "pyiceberg[daft,sql-sqlite]>=0.9.1",
    "uuid-utils>=0.11.0"
]

[project.optional-dependencies]
ray        = ["ray[default]>=2.47"]
inference  = ["ray[serve,llm]>=2.47", "vllm>=0.7.2", "huggingface-hub>=0.26", "transformers>=4.49", "accelerate>=0.29", "datasets>=3.6"]
api        = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
benchmark  = ["esper>=2.45"]
kafka      = ["aiokafka>=0.10"]
dev        = [
    "pytest>=8.3", "pytest-asyncio>=0.26", "ipykernel",
    "black>=24.4", "ruff>=0.4"
]


[tool.pytest.ini_options]
pythonpath = [
    "src"
]
asyncio_default_fixture_loop_scope = "function"
