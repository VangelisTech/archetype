[project]
name = "archetype"
version = "0.1.0"
description = "Lazy Distributed Dataframe-Based ECS Simulation Engine using Daft for processing and LanceDB for storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "daft>=0.5.2",
    "daft[lance,iceberg,sql]>=0.5.2",
    "pyarrow>=16.0.0",
    "lancedb>=0.22.0",
    "python-ulid>=3.0.0",
    "pytest>=8.3.5",
    "datasets>=3.6.0",
    "pytest-asyncio>=0.26.0",
    "pyiceberg[daft,sql-sqlite]>=0.9.1",
    "ipykernel",
    "networkx>=3.4.2",
    "vllm>=0.7.2",
    "ray[serve,llm]>=2.46.0",
    "xgrammar==0.1.11",
    "pynvml==12.0.0",
    "huggingface-hub>=0.26.0",
    "transformers>=4.49.0",
    "accelerate>=0.29.0",
    "datasets>=3.6.0",
]


[tool.pytest.ini_options]
pythonpath = [
    "src"
]
asyncio_default_fixture_loop_scope = "function"

