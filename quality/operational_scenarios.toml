version = 1

# Supported gates emit semantic receipts against the current product.

[[scenario]]
id = "native.public"
kind = "dogfood"
owner = "runtime"
owner_paths = ["packages/archetype-ecs/src/archetype/runtime"]
source_path = "scripts/run_native_acceptance.py"
source_command = ["make", "installed-native-acceptance"]
required_extras = ["analysis", "transports"]
tier = 1
applicability = ["source", "wheel"]
timeout_seconds = 2100
prerequisites = ["binary:DDLOG_PYTHON_LIBRARY", "binary:ARCHETYPE_ACCEPTANCE_DRIVER"]
missing_prerequisite = "fail"
contracts = ["native.public.durable_history", "native.artifacts.verified_facts", "native.transport.grants"]
cleanup_policy = "isolated"
artifact_policy = "receipt"
artifact_schema = "archetype.installed-native/v1"
required_cadence = ["main", "release"]
semantic_oracle = { kind = "pytest", ref = "packages/archetype-ecs/tests/test_native_runtime_binding.py::RuntimeBindingTests::test_two_program_full_empty_cut_historical_fork_and_storage_only_cold_reads" }

