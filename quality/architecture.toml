version = 3
source_root = "src"

[concrete_services]
types = [
  "ArtifactService",
  "ArtifactBundleService",
  "ArtifactTableService",
  "AuditLog",
  "AutoResearchService",
  "CommandGateway",
  "CommandScheduler",
  "EvaluationService",
  "MutationService",
  "MissionAttemptClaimService",
  "MissionAttemptExecutionService",
  "MissionService",
  "QueryService",
  "RedactionService",
  "RuntimeApplication",
  "SandboxService",
  "ServiceContainer",
  "SimulationService",
  "StorageService",
  "WorldService",
]
composition_roots = [
  "archetype.app.container",
  "archetype.api.deps",
  "archetype.runtime.runtime",
]

[top_level_family_policy]
forbidden_outward = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]
reserved_infrastructure = [
  "archetype._api",
  "archetype._logging",
  "archetype._obs",
  "archetype._storage_uri",
  "archetype.api",
  "archetype.app",
  "archetype.cli",
  "archetype.contrib",
  "archetype.core",
  "archetype.runtime",
]

# Every first-party top-level package or module is classified above or
# registered as a domain family below. Domain families may import core and
# themselves implicitly. Every reviewed family-to-family edge must name the
# exact lower family here, and the complete graph must remain acyclic.

[[top_level_family_rule]]
name = "datasets-domain-family"
consumer = "archetype.datasets"
allowed_families = []

[[top_level_family_rule]]
name = "experiments-domain-family"
consumer = "archetype.experiments"
allowed_families = []

[[top_level_family_rule]]
name = "htn-domain-family"
consumer = "archetype.htn"
allowed_families = []

[[package_rule]]
name = "core-does-not-import-outward"
consumer = "archetype.core"
# The checker adds every registered top-level family to this forbidden set.
# Keep the registry as the single source of truth for domain-family scopes.
forbidden = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

[[package_rule]]
name = "app-does-not-import-outward"
consumer = "archetype.app"
forbidden = [
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

# Family rules apply to every module in the package, not only service.py.
# This is the executable dependency DAG represented by the container wiring.

[[family_rule]]
name = "storage-family"
consumer = "archetype.app.storage"
allowed_app = [
  "archetype.app.storage",
  "archetype.app.errors",
