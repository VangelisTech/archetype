version = 3
source_root = "src"

[concrete_services]
types = [
  "ArtifactService",
  "AuditLog",
  "AutoResearchService",
  "CommandGateway",
  "CommandScheduler",
  "EvaluationService",
  "IngestionService",
  "MissionService",
  "PhysicalAIService",
  "RedactionService",
  "RuntimeApplication",
  "SandboxService",
  "ServiceContainer",
  "StorageService",
  "TranscriptIngestionService",
  "TrajectoryService",
  "WorldLifecycle",
  "WorldRegistry",
]
composition_roots = [
  "archetype.app.container",
  "archetype.api.deps",
  "archetype.runtime.runtime",
]

[top_level_family_policy]
forbidden_outward = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]
reserved_infrastructure = [
  "archetype._api",
  "archetype._logging",
  "archetype._obs",
  "archetype._storage_uri",
  "archetype.api",
  "archetype.app",
  "archetype.cli",
  "archetype.core",
  "archetype.runtime",
]
common_family_imports = ["archetype.errors"]

# Every first-party top-level package or module is classified above or
# registered as a domain family in quality/architecture.d/<family>.toml.
# Domain families may import core, exact common-family modules, and themselves
# implicitly. Every reviewed family-to-family edge must name the exact lower
# family in that family's fragment, and the complete merged graph must remain
# acyclic. Fragments hold each family's rule and exception arrays so two family
# changes never edit the same file; scalar policy stays here.

[[package_rule]]
name = "core-does-not-import-outward"
consumer = "archetype.core"
# The checker adds every registered top-level family to this forbidden set.
# Keep the registry as the single source of truth for domain-family scopes.
forbidden = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

[[package_rule]]
name = "app-does-not-import-outward"
consumer = "archetype.app"
forbidden = [
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

# Family rules apply to every module in the package, not only service.py.
# This is the executable dependency DAG represented by the container wiring.

[[family_rule]]
name = "artifact-family"
consumer = "archetype.app.artifacts"
allowed_app = [
  "archetype.app.artifacts",
  "archetype.app.ingestion.interfaces",
]

[[family_rule]]
name = "ingestion-family"
consumer = "archetype.app.ingestion"
allowed_app = [
  "archetype.app.ingestion",
]

[[family_rule]]
name = "redaction-family"
consumer = "archetype.app.redaction"
allowed_app = [
  "archetype.app.redaction",
]

[[family_rule]]
name = "evaluation-family"
consumer = "archetype.app.evaluation"
allowed_app = [
  "archetype.app.evaluation",
  "archetype.app.ingestion.interfaces",
]

[[family_rule]]
name = "mission-family"
consumer = "archetype.app.missions"
allowed_app = [
  "archetype.app.missions",
  "archetype.app.artifacts.interfaces",
  "archetype.app.evaluation.interfaces",
  "archetype.app.ingestion.interfaces",
  "archetype.app.redaction.interfaces",
  "archetype.app.redaction.models",
]

[[family_rule]]
name = "research-family"
consumer = "archetype.app.research"
allowed_app = [
  "archetype.app.research",
]

[[family_rule]]
name = "physical-ai-family"
consumer = "archetype.app.physical_ai"
allowed_app = [
  "archetype.app.physical_ai",
  "archetype.app.evaluation.interfaces",
]

[[family_rule]]
name = "application-family"
consumer = "archetype.app.application"
allowed_app = [
  "archetype.app.application",
  "archetype.app.artifacts.interfaces",
  "archetype.app.evaluation.interfaces",
  "archetype.app.missions.interfaces",
  "archetype.app.physical_ai.interfaces",
  "archetype.app.research.interfaces",
  "archetype.app.models",
]

[[family_rule]]
name = "gateway-family"
consumer = "archetype.app.gateway"
allowed_app = [
  "archetype.app.gateway",
  "archetype.app.application.interfaces",
  "archetype.app.models",
]

[[module_rule]]
module = "archetype.app.ingestion.service"
allowed_interfaces = [
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.artifacts.service"
allowed_interfaces = [
  "archetype.app.ingestion.interfaces.iIngestionService",
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.redaction.service"
allowed_interfaces = []
allowed_app = [
  "archetype.app.redaction.models",
]

[[module_rule]]
module = "archetype.app.evaluation.service"
allowed_interfaces = [
  "archetype.app.evaluation.interfaces.GraderOutput",
  "archetype.app.evaluation.interfaces.TrajectoryGrader",
  "archetype.app.ingestion.interfaces.iIngestionService",
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.missions.service"
allowed_interfaces = [
  "archetype.app.redaction.interfaces.iRedactionService",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.missions.trajectory_service"
allowed_interfaces = [
  "archetype.app.evaluation.interfaces.GraderOutput",
  "archetype.app.evaluation.interfaces.TrajectoryGrader",
  "archetype.app.evaluation.interfaces.iEvaluationService",
  "archetype.storage.interfaces.iStorageService",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.missions.transcript_service"
allowed_interfaces = [
  "archetype.app.artifacts.interfaces.iArtifactService",
  "archetype.app.ingestion.interfaces.iIngestionService",
  "archetype.app.redaction.interfaces.iRedactionService",
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = [
  "archetype.app.redaction.models",
]

[[module_rule]]
module = "archetype.app.physical_ai.service"
allowed_interfaces = [
  "archetype.app.evaluation.interfaces.iEvaluationService",
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldLifecycle",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.research.service"
allowed_interfaces = [
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldLifecycle",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = [
  "archetype.app.research.contracts",
]

[[module_rule]]
module = "archetype.app.application.service"
allowed_interfaces = [
  "archetype.app.artifacts.interfaces.iArtifactService",
  "archetype.app.evaluation.interfaces.iEvaluationService",
  "archetype.app.missions.interfaces.iMissionService",
  "archetype.app.missions.interfaces.iTranscriptIngestionService",
  "archetype.app.missions.interfaces.iTrajectoryService",
  "archetype.app.physical_ai.interfaces.iPhysicalAIService",
  "archetype.app.research.interfaces.iResearchService",
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldLifecycle",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = ["archetype.app.models"]

[[module_rule]]
module = "archetype.app.gateway.service"
allowed_interfaces = [
  "archetype.app.application.interfaces.iRuntimeApplication",
]
allowed_app = [
  "archetype.app.gateway._pr3_commands_bridge",
  "archetype.app.gateway.auth.models",
  "archetype.app.models",
]
# Exact migration edges. These preserve current behavior while the sequenced
# family relocations move each definition once, without compatibility copies.
