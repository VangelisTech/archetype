version = 4
source_roots = [
  "packages/archetype-ecs/src",
  "packages/archetype-missions/src",
  "packages/archetype-physical-ai/src",
  "packages/archetype-research/src",
]

[concrete_services]
types = [
  "ActivityCoordinator",
  "AuditLog",
  "CommandScheduler",
  "MissionService",
  "RedactionService",
  "SandboxService",
  "StorageService",
  "TranscriptIngestionService",
  "TrajectoryService",
  "WorldLifecycle",
  "WorldRegistry",
]
composition_roots = [
  "archetype.wiring",
  "archetype.missions._extension",
  "archetype.physical_ai._extension",
  "archetype.research._extension",
]

[top_level_family_policy]
forbidden_outward = [
  "archetype.app",
  "archetype.runtime",
  "archetype.runtime_resources",
  "archetype.wiring",
  "archetype.api",
  "archetype.cli",
]
reserved_infrastructure = [
  "archetype._api",
  "archetype._logging",
  "archetype._obs",
  "archetype._storage_uri",
  "archetype.api",
  "archetype.cli",
  "archetype.core",
  "archetype.runtime",
  "archetype.runtime_resources",
  "archetype.wiring",
  "archetype.world_libraries",
]
common_family_imports = ["archetype.errors"]

[world_library_policy]
families = [
  "archetype.missions",
  "archetype.physical_ai",
  "archetype.research",
]

[[world_library_adapter]]
module = "archetype.missions._extension"
family = "archetype.missions"
role = "composition"

[[world_library_adapter]]
module = "archetype.missions.runtime"
family = "archetype.missions"
role = "runtime"

[[world_library_adapter]]
module = "archetype.missions.api"
family = "archetype.missions"
role = "api"

[[world_library_adapter]]
module = "archetype.physical_ai._extension"
family = "archetype.physical_ai"
role = "composition"

[[world_library_adapter]]
module = "archetype.physical_ai.runtime"
family = "archetype.physical_ai"
role = "runtime"

[[world_library_adapter]]
module = "archetype.research._extension"
family = "archetype.research"
role = "composition"

[[world_library_adapter]]
module = "archetype.research.runtime"
family = "archetype.research"
role = "runtime"

# Every first-party top-level package or module is classified above or
# registered as a domain family in quality/architecture.d/<family>.toml.
# Domain families may import core, exact common-family modules, and themselves
# implicitly. Every reviewed family-to-family edge must name the exact lower
# family in that family's fragment, and the complete merged graph must remain
# acyclic. Fragments hold each family's rule and exception arrays so two family
# changes never edit the same file; scalar policy stays here.

[[package_rule]]
name = "core-does-not-import-outward"
consumer = "archetype.core"
# The checker adds every registered top-level family to this forbidden set.
# Keep the registry as the single source of truth for domain-family scopes.
forbidden = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

# Family rules apply to every module in the package. This is the executable
# dependency DAG represented by the concrete composition root.
