version = 3
source_root = "src"

[concrete_services]
types = [
  "AuditLog",
  "AutoResearchService",
  "CommandScheduler",
  "MissionService",
  "PhysicalAIService",
  "RedactionService",
  "SandboxService",
  "StorageService",
  "TranscriptIngestionService",
  "TrajectoryService",
  "WorldLifecycle",
  "WorldRegistry",
]
composition_roots = [
  "archetype.wiring",
]

[top_level_family_policy]
forbidden_outward = [
  "archetype.app",
  "archetype.runtime",
  "archetype.runtime_resources",
  "archetype.wiring",
  "archetype.api",
  "archetype.cli",
]
reserved_infrastructure = [
  "archetype._api",
  "archetype._logging",
  "archetype._obs",
  "archetype._storage_uri",
  "archetype.api",
  "archetype.app",
  "archetype.cli",
  "archetype.core",
  "archetype.runtime",
  "archetype.runtime_resources",
  "archetype.wiring",
]
common_family_imports = ["archetype.errors"]

# Every first-party top-level package or module is classified above or
# registered as a domain family in quality/architecture.d/<family>.toml.
# Domain families may import core, exact common-family modules, and themselves
# implicitly. Every reviewed family-to-family edge must name the exact lower
# family in that family's fragment, and the complete merged graph must remain
# acyclic. Fragments hold each family's rule and exception arrays so two family
# changes never edit the same file; scalar policy stays here.

[[package_rule]]
name = "core-does-not-import-outward"
consumer = "archetype.core"
# The checker adds every registered top-level family to this forbidden set.
# Keep the registry as the single source of truth for domain-family scopes.
forbidden = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

[[package_rule]]
name = "app-does-not-import-outward"
consumer = "archetype.app"
forbidden = [
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

# Family rules apply to every module in the package, not only service.py.
# This is the executable dependency DAG represented by the container wiring.

[[family_rule]]
name = "mission-family"
consumer = "archetype.app.missions"
allowed_app = [
  "archetype.app.missions",
]

[[family_rule]]
name = "research-family"
consumer = "archetype.app.research"
allowed_app = [
  "archetype.app.research",
]

[[family_rule]]
name = "physical-ai-family"
consumer = "archetype.app.physical_ai"
allowed_app = [
  "archetype.app.physical_ai",
]

[[module_rule]]
module = "archetype.app.missions.service"
allowed_interfaces = []
allowed_app = []

[[module_rule]]
module = "archetype.app.missions.trajectory_service"
allowed_interfaces = [
  "archetype.storage.interfaces.iStorageService",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.missions.transcript_service"
allowed_interfaces = [
  "archetype.storage.interfaces.iStorageService",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.physical_ai.service"
allowed_interfaces = [
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldLifecycle",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = []

[[module_rule]]
module = "archetype.app.research.service"
allowed_interfaces = [
  "archetype.storage.interfaces.iStorageService",
  "archetype.world.interfaces.iWorldLifecycle",
  "archetype.world.interfaces.iWorldRegistry",
]
allowed_app = [
  "archetype.app.research.contracts",
]

# Exact migration edges. These preserve current behavior while the sequenced
# family relocations move each definition once, without compatibility copies.
