version = 3
source_root = "src"

[concrete_services]
types = [
  "ArtifactService",
  "AuditLog",
  "AutoResearchService",
  "CommandGateway",
  "CommandScheduler",
  "EvaluationService",
  "IngestionService",
  "MutationService",
  "MissionService",
  "PhysicalAIService",
  "QueryService",
  "RedactionService",
  "RuntimeApplication",
  "SandboxService",
  "ServiceContainer",
  "SimulationService",
  "StorageService",
  "TranscriptIngestionService",
  "TrajectoryService",
  "WorldService",
]
composition_roots = [
  "archetype.app.container",
  "archetype.api.deps",
  "archetype.runtime.runtime",
]

[top_level_family_policy]
forbidden_outward = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]
reserved_infrastructure = [
  "archetype._api",
  "archetype._logging",
  "archetype._obs",
  "archetype._storage_uri",
  "archetype.api",
  "archetype.app",
  "archetype.cli",
  "archetype.core",
  "archetype.runtime",
]

# Every first-party top-level package or module is classified above or
# registered as a domain family in quality/architecture.d/<family>.toml.
# Domain families may import core and themselves implicitly. Every reviewed
# family-to-family edge must name the exact lower family in that family's
# fragment, and the complete merged graph must remain acyclic. Fragments hold
# each family's [[top_level_family_rule]] and [[exception]] blocks so two
# family changes never edit the same file; scalar policy stays here.

[[package_rule]]
name = "core-does-not-import-outward"
consumer = "archetype.core"
# The checker adds every registered top-level family to this forbidden set.
# Keep the registry as the single source of truth for domain-family scopes.
forbidden = [
  "archetype.app",
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

[[package_rule]]
name = "app-does-not-import-outward"
consumer = "archetype.app"
forbidden = [
  "archetype.runtime",
  "archetype.api",
  "archetype.cli",
]

# Family rules apply to every module in the package, not only service.py.
# This is the executable dependency DAG represented by the container wiring.

[[family_rule]]
name = "storage-family"
consumer = "archetype.app.storage"
allowed_app = [
  "archetype.app.storage",
  "archetype.app.errors",
  "archetype.app.limits",
]

[[family_rule]]
name = "world-family"
consumer = "archetype.app.world"
allowed_app = [
  "archetype.app.world",
  "archetype.app.storage",
  "archetype.app.models",
]

[[family_rule]]
name = "audit-family"
consumer = "archetype.app.audit"
allowed_app = [
  "archetype.app.audit",
  "archetype.app.storage",
  "archetype.app.models",
