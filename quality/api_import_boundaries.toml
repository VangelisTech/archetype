version = 1

[[import_surface]]
name = "api-composition"
targets = [
  "packages/archetype-ecs/src/archetype/api/app.py",
  "packages/archetype-ecs/src/archetype/api/deps.py",
]
dependency_roots = [
  "archetype.app",
  "archetype.commands",
  "archetype.wiring",
  "archetype.world",
  "archetype.world_libraries",
]
allowed_dependencies = [
  "archetype.commands.dispatch",
  "archetype.commands.models",
  "archetype.wiring",
  "archetype.world_libraries",
]
forbidden_dependencies = [
  "archetype.commands.scheduler",
  "archetype.world.handlers",
  "archetype.world.interfaces",
  "archetype.world.lifecycle",
  "archetype.world.mutation",
  "archetype.world.query",
  "archetype.world.registry",
  "archetype.world.simulation",
]
rationale = "The ASGI lifespan may construct one RuntimeResources owner and expose only its dispatcher; dependencies may consume only command-owned boundary values"

[[import_surface]]
name = "api-routes"
targets = ["packages/archetype-ecs/src/archetype/api/routes/*.py"]
dependency_roots = [
  "archetype.app",
  "archetype.commands",
  "archetype.world",
]
allowed_dependencies = [
  "archetype.commands.dispatch",
  "archetype.commands.models",
  "archetype.world.models",
]
forbidden_dependencies = [
  "archetype.commands.scheduler",
  "archetype.world.handlers",
  "archetype.world.interfaces",
  "archetype.world.lifecycle",
  "archetype.world.mutation",
  "archetype.world.query",
  "archetype.world.registry",
  "archetype.world.simulation",
]
rationale = "API routes translate transport directly into exact family operations and enter only the actor-aware dispatcher boundary"

[[import_surface]]
name = "missions-api-router"
targets = ["packages/archetype-missions/src/archetype/missions/api.py"]
dependency_roots = [
  "archetype.api",
  "archetype.commands",
  "archetype.missions",
  "archetype.world",
]
allowed_dependencies = [
  "archetype.api.deps",
  "archetype.api.errors",
  "archetype.api.models",
  "archetype.commands.dispatch",
  "archetype.commands.models",
  "archetype.missions.authorization",
  "archetype.missions.components",
  "archetype.missions.config",
  "archetype.missions.contracts",
  "archetype.missions.execution_profiles",
  "archetype.missions.models",
  "archetype.missions.relations",
  "archetype.missions.run_contracts",
  "archetype.world.models",
]
forbidden_dependencies = [
  "archetype.commands.scheduler",
  "archetype.missions.service",
  "archetype.world.handlers",
  "archetype.world.interfaces",
  "archetype.world.lifecycle",
  "archetype.world.mutation",
  "archetype.world.query",
  "archetype.world.registry",
  "archetype.world.simulation",
]
rationale = "The optional Missions transport adapter projects family state through framework API dependencies and the actor-aware dispatcher without acquiring workflow or composition authority"

[public_api]
targets = ["packages/archetype-ecs/src/archetype/**/*.py"]
forbidden_owner_types_from = "quality/architecture.toml"
forbidden_parameter_names = [
  "broker",
  "container",
]
