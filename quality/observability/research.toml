version = 1
owner = "research"
family = "research"

[[module_operation_surface]]
qualified_scope = "archetype.research.handlers"

[[module_operation_surface]]
qualified_scope = "archetype.research.views"

[[disposition]]
operations = [
  "handlers.handle_autoresearch",
  "handlers.run_autoresearch",
  "models.CandidatePreparer.__call__",
  "models.Evaluator.__call__",
  "views.next_iteration",
  "views.read_experiment",
  "views.read_head",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome", "retryable_attempt"]
authority = "Persisted experiment state, branch-head rows, iteration records, and typed research results remain authoritative."
evidence = [
  "docs/guide/autoresearch.md",
  "tests/research/test_autoresearch_ledger.py",
  "tests/research/test_autoresearch_admission.py",
]
rationale = "Family-owned free handlers and views have no approved direct signal; durable experiment records and typed callback outcomes prove resumable progress."

[[legacy]]
rule = "raw_exception_logging"
path = "src/archetype/research/handlers.py"
qualified_scope = "archetype.research.handlers._run_autoresearch"
target = "log:exception:'failed to persist autoresearch crash transition for %s':exception"
owner = "research"
issue = 523
reason = "Moved crash-transition behavior preserves the existing bounded durable-attempt failure path."
expiry_condition = "Remove when #523 emits a bounded persistence-failure diagnostic tied to durable attempt evidence."
