version = 1
owner = "physical_ai"
family = "physical_ai"

[[module_operation_surface]]
qualified_scope = "archetype.physical_ai.handlers"

[[disposition]]
operations = [
  "handlers.evaluate_physical_task",
  "handlers.sweep_physical_instructions",
  "interfaces.PhysicalClientLifetimeRegistrar.lease",
  "interfaces.PhysicalEvidenceWorldRetirement.aclose",
  "interfaces.PhysicalWorkflowLifetime.retain_evidence_world",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome"]
authority = "Persisted ManipStatus and ManipTask rows under the returned world/run identity, plus the typed ledger-derived report, remain authoritative."
evidence = [
  "docs/guide/physical-ai.md",
  "tests/physical_ai/test_task_evaluation.py",
  "tests/physical_ai/test_instruction_sweep.py",
  "tests/physical_ai/test_provider_concurrency_contracts.py",
]
rationale = "Physical evaluation produces queryable ledger evidence; a second workflow signal would duplicate rather than strengthen that authority."

[[disposition]]
operations = [
  "interfaces.EnvClient.reset",
  "interfaces.EnvClient.step",
  "interfaces.EnvClient.aclose",
  "interfaces.PolicyClient.act",
  "interfaces.PolicyClient.aclose",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome"]
authority = "The registered host provider remains authoritative for simulator or policy state and returned values; its runtime owner remains authoritative for close success or retryable failure until a consuming workflow commits typed evidence and process cleanup completes."
evidence = [
  "docs/guide/physical-ai.md",
  "tests/physical_ai/test_manipulation_harness.py",
  "tests/physical_ai/test_policy_loop.py",
  "tests/physical_ai/test_provider_concurrency_contracts.py",
  "tests/physical_ai/test_provider_lifetime_contracts.py",
]
rationale = "Provider boundaries return transition values and runtime ownership records cleanup; telemetry cannot acknowledge a provider call, committed tick, or successful close."

[[disposition]]
operations = ["optimization.PerturbationStrategy.propose"]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome"]
authority = "The returned proposal list remains authoritative; any evaluation or durable evidence belongs to the injected evaluator and its owning workflow."
evidence = [
  "docs/guide/physical-ai.md",
  "tests/physical_ai/test_instruction_sweep.py",
]
rationale = "Instruction perturbation is a pure strategy call and has no independently approved signal."
