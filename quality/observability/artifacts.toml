version = 1
owner = "artifacts"
family = "artifacts"

[[disposition]]
operations = [
  "interfaces.iArtifactService.ingest",
  "interfaces.iArtifactService.index",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome"]
authority = "Content-addressed objects, the typed media indexes, and the common artifact index remain authoritative."
evidence = [
  "docs/guide/artifacts.md",
  "tests/app/test_artifact_ingestion.py",
]
rationale = "ArtifactService configures the file pipeline, delegates envelope policy to IngestionService and terminal publication to StorageService; a second signal would not add authority."
