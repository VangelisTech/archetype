version = 1
owner = "activities"
family = "activities"

[[disposition]]
operations = [
  "service._ActivityResultIndex.pending_results",
  "interfaces.iActivitySettlementIndex.admit",
  "interfaces.iActivitySettlementIndex.get",
  "interfaces.iActivitySettlementIndex.has_unsettled",
  "interfaces.iActivitySettlementIndex.pending_results",
  "interfaces.iActivitySettlementIndex.record_orchestrated_result",
  "interfaces.iActivitySettlementIndex.settle_observation",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome"]
authority = "Temporal owns orchestration and recovery; the local index retains immutable admission, external execution identity, bounded result reference, and exact ECS observation settlement."
evidence = [
  "docs/guide/activities.md",
  "tests/integration/test_temporal_activity_world.py",
]
rationale = "The settlement index emits no second orchestration authority; typed facts expose admission, result delivery, and settlement while Temporal owns retries and worker recovery."
