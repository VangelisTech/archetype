version = 1
owner = "missions"
family = "missions"

[[disposition]]
operations = [
  "interfaces.iMissionService.submit",
  "interfaces.iMissionService.run",
  "interfaces.iMissionService.restore_sandbox",
  "interfaces.iMissionService.close",
  "interfaces.iMissionService.query",
  "interfaces.iMissionService.world_id",
  "interfaces.iTrajectoryService.query",
  "interfaces.iTrajectoryService.grade",
  "interfaces.iTranscriptIngestionService.ingest",
  "interfaces.iTranscriptIngestionService.read",
  "service.MissionWorld.info",
  "service.MissionWorld.query",
  "service.MissionWorld.reserve_ids",
  "service.MissionWorld.spawn",
  "service.MissionWorld.spawn_reserved",
  "service.MissionWorld.step",
  "service.MissionWorld.shutdown",
  "service.MissionWorld.update",
  "service.MissionWorld.world_id",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome", "retryable_attempt"]
authority = "Persisted mission/task state, dispatch intent, execution observations, validator results, and repository commits remain authoritative."
evidence = [
  "docs/guide/agent-missions.md",
  "tests/integration/test_agent_mission_service.py",
  "tests/app/test_trajectory_service.py",
]
rationale = "Mission orchestration emits no second authority signal; world history records every decision and observation."
