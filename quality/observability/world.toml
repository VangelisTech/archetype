[[legacy]]
rule = "raw_exception_logging"
path = "src/archetype/world/lifecycle.py"
qualified_scope = "archetype.world.lifecycle.WorldLifecycle._mark_failed_activation"
target = "log:exception:'failed to mark incompletely activated world %s non-active':exception"
owner = "world"
issue = 519
reason = "Failed-activation reconciliation currently exports a raw exception stack after preserving the original activation failure."
expiry_condition = "Remove when #519 emits a bounded activation-reconciliation diagnostic tied to durable catalog state."

