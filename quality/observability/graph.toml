version = 1
owner = "graph"
family = "graph"

[[disposition]]
operations = [
  "edges.WorldLike.despawn",
  "edges.WorldLike.info",
  "edges.WorldLike.query",
  "edges.WorldLike.spawn",
  "sync.SyncWorldLike.despawn",
  "sync.SyncWorldLike.info",
  "sync.SyncWorldLike.query",
  "sync.SyncWorldLike.spawn",
]
signals = ["none"]
outcomes = ["propagated_failure", "handled_outcome"]
authority = "Persisted world component and relation state, plus the returned lazy frames and typed edge results, remain authoritative."
evidence = [
  "docs/design/graph-system.md",
  "tests/graph/test_edge_contract.py",
]
rationale = "Graph helpers consume structural world-handle operations; they do not create a second telemetry authority for world mutations or reads."
