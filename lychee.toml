# lychee link checker configuration
# https://lychee.cli.rs/

# Timeout per request (seconds)
timeout = 30

# Max concurrent requests
max_concurrency = 8

# Accept status codes (200 + redirects)
accept = [200, 204, 301, 302, 403, 429]

# Exclude patterns
exclude = [
    # Localhost / dev servers
    "http://localhost",
    "http://127\\.0\\.0\\.1",
    # Site-relative links are validated by the static build.
    "^/",
    # Email addresses
    "^mailto:",
    # Anchors-only links
    "^#",
    # Own repo blob links — files may exist on the PR branch but 404 on main until merged
    "https://github\\.com/VangelisTech/archetype/blob/main/",
    # The canonical hostname is attached by the production Pages deployment.
    # Internal site links are checked by MkDocs before that deployment runs.
    "https://archetype\\.vangelis\\.tech/",
]

# File globs are passed via CLI args, not here.
# The `include` field filters URLs (regex), not input files.

# Skip these paths entirely
exclude_path = [
    "node_modules",
    ".venv",
    "uv.lock",
]
