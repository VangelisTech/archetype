#
# Machine-readable pinned inventory of every executable dependency that can
# affect a coding-agent attempt. Normative contract:
# docs/guide/sandbox-execution.md, "9. Pinned environment inventory".
# Rendered operator view: docs/reference/version-inventory.md (generated).
#
# Every pinned artifact carries an exact version, a credential-free https
# source, and an immutable digest. `archetype.app.sandboxes.versions` fails
# closed on ranges, floating tags, missing digests, or credential-shaped
# values; installers must consume the resolved pin and digest, never `latest`.

schema_version = 1

