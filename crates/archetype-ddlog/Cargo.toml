[package]
name = "archetype-ddlog"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version = "1.95"
description = "Archetype ECS cuts over the DDlog Runtime execution owner"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
arrow-array = "59.2"
arrow-cast = "59.2"
arrow-schema = "59.2"
base64 = "0.22.1"
bytes = "1"
ddlog-runtime = { git = "https://github.com/everettVT/ddlog-runtime", rev = "e7bec261336ac5cdaa6d99778feeaedcb03a73ae" }
futures = "0.3"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "4d83bc77dc10cff851a3ef427c451ff977bc3643" }
iceberg-catalog-sql = { git = "https://github.com/apache/iceberg-rust", rev = "4d83bc77dc10cff851a3ef427c451ff977bc3643" }
opendal = { version = "=0.58.2", default-features = false, features = ["services-s3", "http-transport-reqwest-rustls", "executors-tokio"] }
http = "1"
opendal-http-transport-reqwest = { version = "=0.58.2", default-features = false, features = ["rustls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
parquet = { version = "59.2", default-features = false, features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "sqlite", "runtime-tokio"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
typetag = "0.2"
url = "2"
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
tempfile = "3"
