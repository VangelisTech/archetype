[package]
name = "archetype-ddlog-python"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version = "1.95"
description = "Private C ABI for the supported native hosted runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
archetype-ddlog = { path = "../archetype-ddlog" }
arrow-array = "59.2"
ddlog-runtime = { git = "https://github.com/everettVT/ddlog-runtime", rev = "e7bec261336ac5cdaa6d99778feeaedcb03a73ae" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.48", features = ["rt-multi-thread", "sync"] }
