# Lazy-evaluation audit allowlist.
#
# Each entry documents an exception to Archetype's lazy execution
# contract. .collect() and .to_pylist() force a Daft DataFrame through
# Python memory and defeat query planning. Adding an entry here is
# auditable: PR reviewers will challenge any new entry whose reason
# does not name a specific technical boundary (storage write, single-row
# migration extract, debug logging).
#
# Generic reasons ("needed", "for the test", "convenience") are
# rejected automatically by scripts/check_lazy_audit.py.
#
# Scope: src/ only. Tests are exempt — terminal materialization at the
# assertion boundary is expected and not part of the audited contract.
#
# **Sanctioned exemption — batch-UDF Series access**
#
# Series.to_pylist() called on a *parameter* of a function decorated
# with @daft.method.batch or @daft.func.batch does NOT need an entry
# here. When Daft invokes such a function the batch is already
# materialised by the executor — converting parameters to Python lists
# is the expected interface at that boundary. The checker detects this
# pattern via AST analysis and reports these sites separately as
# "udf-boundary (sanctioned)". See scripts/check_lazy_audit.py for
# the full detection logic.

[[entries]]
path = "src/archetype/api/models.py"
line = 33
method = "collect"
reason = "HTTP JSON response boundary: FastAPI must receive concrete row dictionaries for response encoding; a Daft lazy DataFrame cannot be represented as JSON without executing the query."

[[entries]]
path = "src/archetype/api/models.py"
line = 33
method = "to_pylist"
reason = "HTTP JSON response boundary: convert the already-collected Daft result into row dictionaries for FastAPI's JSON encoder at the terminal REST boundary."

[[entries]]
path = "src/archetype/core/aio/async_store.py"
line = 156
method = "collect"
reason = "Storage write boundary: defensive empty-frame probe before delegating to the backing table writer; cannot be expressed as a Daft predicate because count_rows requires materialised state."

[[entries]]
path = "src/archetype/core/aio/async_world.py"
line = 335
method = "to_pylist"
reason = "Cross-archetype entity migration: extract the latest tick row as a Python dict for component-overlay, which mutates field-by-field before re-insertion into the new archetype."

[[entries]]
path = "src/archetype/core/aio/async_lancedb_store.py"
line = 173
method = "collect"
reason = "LanceDB write boundary: defensive empty-frame probe to avoid Lance casting errors on zero-row appends; precedes the actual table.append call."

[[entries]]
path = "src/archetype/core/sync/store.py"
line = 132
method = "collect"
reason = "Debug-mode-only logging: materialise so count_rows and df.show emit diagnostics; gated on self.debug and never reached in production execution paths."

[[entries]]
path = "src/archetype/core/sync/world.py"
line = 270
method = "to_pylist"
reason = "Cross-archetype entity migration (sync mirror of async_world): extract the latest tick row for component overlay before re-insertion."

[[entries]]
path = "src/archetype/core/lineage.py"
line = 105
method = "to_pylist"
reason = "Lineage metadata extract: a fork's ancestor segments (bounded by fork depth, typically 1-3 rows) must become Python (world_id, run_id, up_to_tick) tuples because they route subsequent per-tick store queries; the routing decision cannot be expressed inside a single Daft plan."

[[entries]]
path = "src/archetype/app/autoresearch_service.py"
line = 313
method = "to_pylist"
reason = "Single-row loop-state extract: the latest BranchHead row must enter Python control flow (incumbent score comparison, head entity id for the next update) at the autoresearch loop boundary; the comparison drives imperative orchestration, not a further dataframe computation."

[[entries]]
path = "src/archetype/experiments/boundary.py"
line = 119
method = "to_pylist"
reason = "series_to_rows helper: converts each Series parameter to a Python list inside a list comprehension. This function is called exclusively from @daft.method.batch UDF bodies (MuJoCo C-library boundary, env RPC boundary, policy inference boundary) where the Daft executor has already materialised the batch. The AST checker auto-exempts to_pylist calls on named parameters of @daft.method.batch functions but cannot trace through this plain helper indirection; the call is semantically equivalent to an auto-sanctioned UDF-boundary access."

[[entries]]
path = "src/archetype/experiments/execution.py"
line = 175
method = "collect"
reason = "External trial backend orchestration boundary: processors must materialise the bounded control-plane archetype for one tick to call the process-local TrialExecutionBackend resource with idempotency keys and global per-tick submission/poll limits; these side-effecting backend calls cannot be expressed as pure Daft expressions."

[[entries]]
path = "src/archetype/experiments/execution.py"
line = 177
method = "to_pylist"
reason = "External trial backend orchestration boundary: after the bounded control-plane frame is collected, row dictionaries drive process-local submit/poll calls and lifecycle column updates against TrialExecutionBackend; the side-effecting resource boundary and global per-tick caps cannot be represented lazily in a Daft plan."
