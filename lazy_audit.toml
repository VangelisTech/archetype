# Lazy-evaluation audit allowlist.
#
# Each entry documents an exception to Archetype's lazy execution
# contract. Execution-capable terminals run a Daft DataFrame plan;
# conversion terminals may also force it through Python memory and
# defeat query planning. Adding an entry here is auditable: PR reviewers
# will challenge any new entry whose reason does not name a specific
# technical boundary (storage write, transport conversion, single-row
# migration extract).
#
# Generic reasons ("needed", "for the test", "convenience") are
# rejected automatically by scripts/check_lazy_audit.py.
#
# Zero-exception ban (issue #538): `.count_rows()` under
# `packages/archetype-ecs/src/archetype/core/` cannot be allowlisted at all — core submits frames
# to their owning append/write boundary instead of counting rows to decide
# whether work exists; an unknown receipt count is None, not a preflight.
# scripts/check_lazy_audit.py rejects both the call site and any entry
# that tries to admit one.
#
# Entries are keyed by (path, symbol, expr, method) — never by line
# number. `symbol` is the dotted path of the enclosing def/class (or
# "<module>"); `expr` is the normalized source of the audited attribute
# access. An edit elsewhere in the file cannot invalidate an entry, and
# reformatting the call cannot either, because `expr` comes from
# ast.unparse. Editing the audited expression itself does re-open review,
# which is the intent. Run `python scripts/check_lazy_audit.py --list` to
# see the current key for every site.
#
# Scope: src/ only. Tests are exempt — terminal materialization at the
# assertion boundary is expected and not part of the audited contract.
#
# **Sanctioned exemption — batch-UDF Series access**
#
# Series.to_pylist() called on a *parameter* of a function decorated
# with @daft.method.batch or @daft.func.batch does NOT need an entry
# here. When Daft invokes such a function the batch is already
# materialised by the executor — converting parameters to Python lists
# is the expected interface at that boundary. The checker detects this
# pattern via AST analysis and reports these sites separately as
# "udf-boundary (sanctioned)". See scripts/check_lazy_audit.py for
# the full detection logic.

