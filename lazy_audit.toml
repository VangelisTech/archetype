qualname = "_collect_discovered_sources"
reason = "File discovery boundary: materializes only the current call's file references, source URIs, and content hashes once before deduplication so zero matched sources are distinguishable from a retry and file bytes are not rehashed. Typed artifact payload rows remain lazy through the Iceberg write."

[[entries]]
path = "src/archetype/app/artifacts/table_service.py"
line = 40
method = "collect"
qualname = "_collect_candidate_sources"
reason = "Processor candidate boundary: materializes the distinct, existing-key-filtered identities derived from the already materialized discovery frame so the emptiness check, processor, and identity validation reuse one candidate set. It does not reread file bytes or materialize typed artifact payload rows."

[[entries]]
path = "src/archetype/app/world/service.py"
