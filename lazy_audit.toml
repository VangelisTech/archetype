# Lazy-evaluation audit allowlist.
#
# Each entry documents an exception to Archetype's lazy execution
# contract. .collect() and .to_pylist() force a Daft DataFrame through
# Python memory and defeat query planning. Adding an entry here is
# auditable: PR reviewers will challenge any new entry whose reason
# does not name a specific technical boundary (storage write, single-row
# migration extract, debug logging).
#
# Generic reasons ("needed", "for the test", "convenience") are
# rejected automatically by scripts/check_lazy_audit.py.
# Entries are identified by path, enclosing function qualname, and method.
# The line is retained only as a review and diagnostic hint.
#
# Scope: src/ only. Tests are exempt — terminal materialization at the
# assertion boundary is expected and not part of the audited contract.
#
# **Sanctioned exemption — batch-UDF Series access**
#
# Series.to_pylist() called on a *parameter* of a function decorated
# with @daft.method.batch or @daft.func.batch does NOT need an entry
# here. When Daft invokes such a function the batch is already
# materialised by the executor — converting parameters to Python lists
# is the expected interface at that boundary. The checker detects this
# pattern via AST analysis and reports these sites separately as
# "udf-boundary (sanctioned)". See scripts/check_lazy_audit.py for
# the full detection logic.

[[entries]]
path = "src/archetype/api/models.py"
line = 33
method = "collect"
qualname = "dataframe_to_rows"
reason = "HTTP JSON response boundary: FastAPI must receive concrete row dictionaries for response encoding; a Daft lazy DataFrame cannot be represented as JSON without executing the query."

[[entries]]
path = "src/archetype/api/models.py"
line = 33
method = "to_pylist"
qualname = "dataframe_to_rows"
reason = "HTTP JSON response boundary: convert the already-collected Daft result into row dictionaries for FastAPI's JSON encoder at the terminal REST boundary."

