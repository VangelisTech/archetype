repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^(src|tests)/.*\\.py$"
      - id: ruff-format
        files: "^(src|tests)/.*\\.py$"

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Ensure uv.lock is in sync
        entry: uv lock --check
        language: system
        pass_filenames: false

      - id: check-license-headers
        name: Check Apache 2.0 license headers
        entry: python3 scripts/check_license_headers.py
        language: system
        files: '^src/.*\.py$'
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
