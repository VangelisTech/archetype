repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^(src|tests|evals|bench|scripts|quality|experiments|examples)/.*\\.py$"
      - id: ruff-format
        files: "^(src|tests|evals|bench|scripts|quality|experiments|examples)/.*\\.py$"

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.48
    hooks:
      - id: ty
        # Scope is controlled by [tool.ty.src] in pyproject.toml (ty follows
        # imports from the project root, not pre-commit's file list), so run a
        # full configured check rather than per-file. Trigger on src/ + config.
        files: '^(src/.*\.py|pyproject\.toml)$'
        pass_filenames: false

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Ensure uv.lock is in sync (and pyproject [tool.uv] parses)
        entry: bash scripts/check_uv_lock.sh
        language: system
        pass_filenames: false

      - id: check-license-headers
        name: Check Apache 2.0 license headers
        entry: python3 scripts/check_license_headers.py
        language: system
        files: '^src/.*\.py$'
        pass_filenames: true

      - id: lazy-audit
        name: Lazy-evaluation audit (.collect / .to_pylist gating)
        entry: uv run python scripts/check_lazy_audit.py
        language: system
        files: '^src/.*\.py$|^lazy_audit\.toml$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses the python/name custom tag (mermaid2 fence); --unsafe
        # syntax-checks without constructing tagged objects.
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
