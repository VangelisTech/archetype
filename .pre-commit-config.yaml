repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^(src|tests)/.*\\.py$"
      - id: ruff-format
        files: "^(src|tests)/.*\\.py$"

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Ensure uv.lock is in sync (and pyproject [tool.uv] parses)
        entry: bash scripts/check_uv_lock.sh
        language: system
        pass_filenames: false

      - id: check-license-headers
        name: Check Apache 2.0 license headers
        entry: python3 scripts/check_license_headers.py
        language: system
        files: '^src/.*\.py$'
        pass_filenames: true

      - id: lazy-audit
        name: Lazy-evaluation audit (.collect / .to_pylist gating)
        entry: uv run python scripts/check_lazy_audit.py
        language: system
        files: '^src/.*\.py$|^lazy_audit\.toml$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
