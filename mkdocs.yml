site_name: Archetype
site_description: Dataframe-first simulations and agent workflows in Python
site_url: https://archetype.vangelis.tech/docs
repo_url: https://github.com/VangelisTech/archetype
repo_name: VangelisTech/archetype

docs_dir: docs
site_dir: site/docs

# Design notes and planning records are retained in the published source tree
# but are not part of the reader-facing documentation. Selected historical
# reports are explicitly classified under the History section below.
not_in_nav: |
  design/**
  planning/**

theme:
  name: material
  language: en
  logo: https://vangelis.tech/logo.jpg
  favicon: https://vangelis.tech/logo.jpg
  font: false
  palette:
    scheme: default
    primary: white
    accent: black
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/vangelis.css

extra:
  generator: false

copyright: Copyright &copy; 2026 Vangelis Tech

