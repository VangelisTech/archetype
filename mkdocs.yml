site_name: Archetype
site_description: Dataframe-first simulations and agent workflows in Python
site_url: https://archetype.vangelis.tech/docs
repo_url: https://github.com/VangelisTech/archetype
repo_name: VangelisTech/archetype

docs_dir: docs
site_dir: site/docs

# Design notes, planning records, and historical reports are retained in the
# published source tree but are not part of the reader-facing documentation.
not_in_nav: |
  design/**
  planning/**
  reports/**

theme:
  name: material
  language: en
  logo: https://vangelis.tech/logo.jpg
  favicon: https://vangelis.tech/logo.jpg
  font: false
  palette:
    scheme: default
    primary: white
    accent: black
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/vangelis.css

extra:
  generator: false

copyright: Copyright &copy; 2026 Vangelis Tech

nav:
  - Getting Started:
      - Overview: index.md
      - Quickstart: guide/quickstart.md
      - Choose an Example: guide/examples.md
  - User Guide:
      - Building Simulations: guide/building-simulations.md
      - Components: guide/components.md
      - Processors: guide/processors.md
      - Worlds: guide/working-with-worlds.md
      - History and Forks: guide/history-and-forks.md
      - Resources: guide/resources.md
      - Lifecycle Hooks: guide/hooks.md
      - Storage: guide/stores.md
      - Configuration: guide/run-config.md
  - Advanced Guides:
      - Service Hosting: guide/app-overview.md
      - Custom Commands: guide/custom-commands.md
      - Access Control and Audit: guide/command-gate.md
      - Token Quotas: guide/token-quotas.md
      - Running a Server: guide/api-layer.md
      - Trajectories: guide/trajectories.md
      - AutoResearch: guide/autoresearch.md
      - LIBERO Recipe: guide/libero-recipe.md
      - Tragedy of the Commons: experiments/tragedy-of-the-commons.md
  - Reference:
      - REST API: reference/rest-api.md
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
  - Development:
      - Contributing: guide/contributing.md
      - Architecture Overview: guide/architecture.md
      - Runtime Contract: guide/runtime.md
      - Specifications: guide/specification.md
      - Service Protocols: guide/service-protocols.md
      - Execution Hierarchy: guide/execution-hierarchy.md
      - World Lifecycle: guide/world-lifecycle.md
      - Durable Discovery: guide/durable-discovery.md
      - Atomic Visibility: guide/atomic-visibility.md
      - Durable Facts: guide/durable-facts.md
      - Audit Log: guide/audit-log.md
      - Core Internals:
          - Archetypes: guide/archetype.md
          - Systems: guide/system-execution.md
          - World Internals: guide/worlds.md
          - Queries: guide/querier.md
          - Updates: guide/updater.md
          - Data Flow: guide/data-flow.md
          - Command Broker: guide/broker.md
          - Services: guide/services.md
      - Testing: guide/mutation-testing.md
      - Rust Core Plan: guide/rust-core-plan.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            show_if_no_docstring: true
            docstring_style: google
