site_name: Archetype
site_description: Typed simulations, world history, and durable artifacts
site_url: https://archetype.vangelis.tech/docs
repo_url: https://github.com/VangelisTech/archetype
repo_name: VangelisTech/archetype

docs_dir: docs
site_dir: site/docs

# Design notes and planning records are retained in the published source tree
# but are not part of the reader-facing documentation. Selected historical
# reports are explicitly classified under the History section below.
not_in_nav: |
  design/**
  planning/**
  compatibility/**
  guide/**
  reference/**
  framework/**
  research/**
  smol/**
  incidents/**
  reports/**
  maintainers/**

theme:
  name: material
  language: en
  logo: https://vangelis.tech/logo.jpg
  favicon: https://vangelis.tech/logo.jpg
  font: false
  palette:
    scheme: default
    primary: white
    accent: black
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/vangelis.css

extra:
  generator: false

copyright: Copyright &copy; 2026 Vangelis Tech

nav:
  - Start:
      - Overview: index.md
      - Quickstart: guide/quickstart.md
      - Runtime: guide/runtime.md
      - Durability: guide/durability.md
      - Artifacts: guide/artifacts.md
      - History and Forks: guide/history-and-forks.md
      - HTTP and MCP: guide/transports.md
  - Reference:
      - Specification: guide/specification.md
      - Python API: reference/python-api.md
      - Runtime: reference/python/runtime.md
      - World Handles: reference/python/world-handle.md
      - Values: reference/python/runtime-models.md
      - Offline Contracts: reference/python/artifacts.md
      - CLI: reference/cli.md
      - Operations: reference/native-operations.md
      - Contract Evidence: reference/contract-traceability.md
  - Compatibility:
      - Migration to 0.7: guide/migration-0.7.md
      - Example Roles: guide/examples.md
      - Version 0.6 Runtime: compatibility/0.6/guide/runtime.md
      - Version 0.6 Research: compatibility/0.6/guide/autoresearch.md

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/archetype-ecs/src
          options:
            extensions:
              - scripts/griffe_world_libraries.py:WorldLibraryPackages
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            filters:
              - "!^_"
            inherited_members: false
            show_bases: false
            show_if_no_docstring: false
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
