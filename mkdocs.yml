site_name: Archetype
site_description: Entity-Component-System simulation engine for AI agents
site_url: https://archetype-docs.pages.dev
repo_url: https://github.com/VangelisTech/archetype
repo_name: VangelisTech/archetype

docs_dir: docs

theme:
  name: shadcn
  custom_dir: docs/overrides
  icon: assets/logo.png
  favicon: assets/logo.png

extra_css:
  - stylesheets/shadcn.css

nav:
  - Getting Started:
      - archetype-ecs: index.md
      - Quickstart: guide/quickstart.md
      - Specification: guide/specification.md
      - Examples: guide/examples.md
      - Contributing Guide: guide/contributing.md
  - Guides:
      - Building Simulations: guide/building-simulations.md
      - Custom Commands: guide/custom-commands.md
      - Token Quotas: guide/token-quotas.md
      - Trajectories: guide/trajectories.md
      - AutoResearch: guide/autoresearch.md
  - Core Architecture:
      - Overview: guide/architecture.md
      - Archetypes: guide/archetype.md
      - Components: guide/components.md
      - Processors: guide/processors.md
      - Systems: guide/system-execution.md
      - Worlds: guide/worlds.md
      - Lifecycle Hooks: guide/hooks.md
      - Resources: guide/resources.md
      - Stores: guide/stores.md
      - Querier: guide/querier.md
      - Updater: guide/updater.md
      - Configuration: guide/run-config.md
  - App Architecture:
      - Overview: guide/app-overview.md
      - Data Flow: guide/data-flow.md
      - Command Broker: guide/broker.md
      - Services: guide/services.md
      - API Layer: guide/api-layer.md
  - Reference:
      - REST API: reference/rest-api.md
      - CLI: reference/cli.md
      - Python API: reference/python-api.md

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      css_class: codehilite
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

hooks:
  - docs/hooks/copy_page.py

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            show_if_no_docstring: true
            docstring_style: google
            docstring_style: google
