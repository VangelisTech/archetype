# typos-cli configuration — domain-specific allowlist
# https://github.com/crate-ci/typos

[default.extend-words]
# Project & org names
Vangelis = "Vangelis"
VangelisTech = "VangelisTech"
Kleven = "Kleven"
everettVT = "everettVT"

# Framework / library names
Daft = "Daft"
daft = "daft"
LanceDB = "LanceDB"
lancedb = "lancedb"
ruff = "ruff"
pyright = "pyright"
lychee = "lychee"
typos = "typos"
Ollama = "Ollama"
vLLM = "vLLM"
Cogito = "Cogito"

# Technical terms
ECS = "ECS"
RBAC = "RBAC"
MCTS = "MCTS"
OIDC = "OIDC"
DAG = "DAG"
pylist = "pylist"
unnest = "unnest"
semver = "semver"
# Deliberate user-typo phrase matched against session transcripts
youre = "youre"

# HTN: negative-precondition column, paired with `pp` (positive)
pn = "pn"

[default.extend-identifiers]
AsyncAnthropic = "AsyncAnthropic"

[files]
extend-exclude = [
    "uv.lock",
    "*.svg",
    "*.png",
    "*.ico",
]
