<header class="bg-background sticky top-0 z-50 w-full">
    <div class="container-wrapper 3xl:fixed:px-0 px-6">
        <div class="3xl:fixed:container flex h-(--header-height) items-center gap-2 **:data-[slot=separator]:!h-4">
            <button id="menu-button" data-slot="popover-trigger" onclick="onMobileMenuButtonClick(event)"
                class="group flex h-8 items-center justify-start gap-2.5 whitespace-nowrap px-0 text-sm font-medium outline-none lg:hidden"
                type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="bottom-sidebar"
                data-state="closed">
                <span class="relative flex h-8 w-4 items-center justify-center">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <line x1="0" x2="16" y1="5" y2="5" />
                        <line x1="0" x2="16" y1="11" y2="11" />
                    </svg>
                </span>
                <span class="text-lg leading-none">Menu</span>
            </button>

            <a data-slot="button"
                class="hidden h-8 items-center justify-center gap-2 whitespace-nowrap text-sm font-medium outline-none lg:flex"
                href="{{ nav.homepage.url | url }}">
                <span class="size-8 flex flex-row items-center justify-center">
                    {% include "components/icon.html" %}
                </span>
                {% if config.theme.show_title %}
                <span class="pr-2 text-base font-semibold">{{ config.site_name }}</span>
                {% endif %}
            </a>

            {% if config.theme.topbar_sections %}
            {% include "templates/header_navigation.html" %}
            {% endif %}

            <div class="ml-auto flex items-center gap-2 md:flex-1 md:justify-end">
                <div class="hidden w-full flex-1 md:flex md:w-auto md:flex-none">
                    {% include "templates/search.html" %}
                </div>
                {% if config.repo_url %}
                <div data-orientation="vertical" role="none" data-slot="separator"
                    class="bg-border ml-2 hidden h-4 w-px shrink-0 lg:block"></div>
                <a target="_blank" rel="noreferrer" data-slot="button"
                    class="inline-flex h-8 items-center justify-center rounded-md px-3 text-sm font-medium hover:bg-accent hover:text-accent-foreground"
                    href="{{ config.repo_url }}">GitHub</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
