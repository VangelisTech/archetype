[project]
name = "mkdocs-pyodide"
version = "0.1.0"
description = "MkDocs plugin for live, editable Python code blocks powered by Pyodide"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vangelis Technologies Inc.", email = "everett@vangelis.tech" },
]
keywords = ["mkdocs", "pyodide", "python", "documentation", "interactive", "live-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: MkDocs",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Topic :: Documentation",
]
dependencies = [
    "mkdocs>=1.4",
]

[project.entry-points."mkdocs.plugins"]
pyodide = "mkdocs_pyodide.plugin:PyodidePlugin"

[project.optional-dependencies]
dev = ["pytest>=8.0", "beautifulsoup4>=4.12"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mkdocs_pyodide = ["js/*.js", "css/*.css"]
