[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archetype-transports"
version = "0.7.0"
description = "HTTP and official MCP SDK adapters for the shared Archetype operation contract"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["archetype-native==0.7.0", "mcp==2.3.0", "pyjwt[crypto]==2.15.1", "cryptography==50.0.1", "starlette==1.3.1", "httpx2==2.13.1"]

[tool.setuptools.packages.find]
where = ["src"]
