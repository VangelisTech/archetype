[project]
name = "archetype-ecs"
version = "0.6.2"
description = "DataFrame-first, append-only ECS framework for simulations and world libraries."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vangelis Technologies Inc.", email = "everett@vangelis.tech" },
]
keywords = ["simulation", "ecs", "reinforcement-learning", "llm", "daft", "lancedb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "daft[lance,iceberg,audio]>=0.7.19",
    "openai<2.39.0",
    "numpy<2.4.0",
    "av>=15.0.0,<17.1.0",
    "pillow>=12.3.0",
    "msgpack>=1.2.1",
    "lancedb>=0.22.0",
    "pyiceberg[daft,sql-sqlite]",
    "uuid-utils>=0.11.0",
    "xxhash>=3.5",
    "pypdf>=6.14.2",
    "psutil>=5.9",
    "pydantic>=2.0",
    "packaging>=24.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.9",
    "click>=8.3.3",
    "httpx>=0.27",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
archetype = "archetype.cli.main:app"

[project.optional-dependencies]
missions = ["archetype-missions>=0.6,<0.7"]
physical-ai = ["archetype-physical-ai>=0.6,<0.7"]
research = ["archetype-research>=0.6,<0.7"]
all = [
    "archetype-missions>=0.6,<0.7",
    "archetype-physical-ai>=0.6,<0.7",
    "archetype-research>=0.6,<0.7",
]
coding-agent = ["archetype-missions[modal]>=0.6,<0.7"]
sim = ["archetype-physical-ai[sim]>=0.6,<0.7"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.20"]
logfire = ["logfire[fastapi]>=4.32.0"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["archetype", "archetype.*"]
namespaces = true
