[project]
name = "archetype-physical-ai"
version = "0.6.0"
description = "Physical state, policies, and hosted episode workflows for Archetype."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vangelis Technologies Inc.", email = "everett@vangelis.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "archetype-ecs>=0.6,<0.7",
    "daft>=0.7.19",
    "pyarrow>=16",
    "pydantic>=2.0",
    "uuid-utils>=0.11.0",
]

[project.optional-dependencies]
modal = ["modal==1.5.2"]
sim = ["mujoco>=3.2"]
all = ["modal==1.5.2", "mujoco>=3.2"]

[project.entry-points."archetype.world_libraries"]
physical-ai = "archetype.physical_ai._extension:get_manifest"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["archetype.physical_ai*"]
namespaces = true
