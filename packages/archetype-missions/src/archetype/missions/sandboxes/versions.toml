# AgentMissionConfig.sandbox_environment.

schema_version = 2

[[artifact]]
id = "codex-cli"
status = "pinned"
role = "agent-harness"
kind = "npm-package"
harness = "codex"
name = "@openai/codex"
version = "0.144.6"
source = "https://registry.npmjs.org/@openai/codex/-/codex-0.144.6.tgz"
