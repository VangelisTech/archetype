consumers = ["#563", "#565", "#567"]

[[artifact.harness_interfaces]]
id = "modal-app-server"
invoke = ["codex", "app-server"]
output_flags = ["json-rpc"]
resume = ["thread/resume"]
session_event = "turn/completed"
session_fields = ["threadId", "turn.id"]

[[artifact.harness_interfaces]]
id = "capability-exec-json"
invoke = ["codex", "exec"]
output_flags = ["json"]
resume = ["exec", "resume"]
session_event = "thread.started"
session_fields = ["thread_id"]

