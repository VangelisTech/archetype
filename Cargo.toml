[workspace]
members = [
    "crates/archetype-bench",
    "crates/archetype-core",
    "crates/archetype-ffi",
    "crates/archetype-parquet",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/VangelisTech/archetype"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
arrow-array = { version = "58.3.0", features = ["ffi"] }
arrow-buffer = "58.3.0"
arrow-data = { version = "58.3.0", features = ["ffi"] }
arrow-schema = { version = "58.3.0", features = ["ffi"] }
arrow-select = "58.3.0"
async-trait = "0.1.89"
parquet = { version = "58.3.0", features = ["arrow"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.19.0", features = ["v7"] }
